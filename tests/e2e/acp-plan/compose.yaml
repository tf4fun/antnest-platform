# Disposable Plan acceptance; no retained development ports or fixed-IP overlap.
services:
  temporal:
    ports: !reset []
networks:
  control:
    ipam:
      config: !override
        - subnet: ${ANTNEST_EGRESS_CONTROL_SUBNET}
          ip_range: ${ANTNEST_PLAN_CONTROL_DYNAMIC_RANGE}
  runtime-management:
    ipam:
      config: !override
        - subnet: ${ANTNEST_RUNTIME_MANAGEMENT_SUBNET}
          ip_range: ${ANTNEST_PLAN_RUNTIME_DYNAMIC_RANGE}
