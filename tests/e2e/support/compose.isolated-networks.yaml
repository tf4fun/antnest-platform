# Keep disposable endpoints away from Egress and Jaeger's fixed low addresses.
networks:
  control:
    ipam:
      config: !override
        - subnet: ${ANTNEST_EGRESS_CONTROL_SUBNET}
          ip_range: ${ANTNEST_E2E_CONTROL_DYNAMIC_RANGE}
  runtime-management:
    ipam:
      config: !override
        - subnet: ${ANTNEST_RUNTIME_MANAGEMENT_SUBNET}
          ip_range: ${ANTNEST_E2E_RUNTIME_DYNAMIC_RANGE}
