# Current candidates for the receipt regression; normal local tags stay intact.
services:
  identity-service:
    image: ${ANTNEST_RECEIPT_E2E_IDENTITY_IMAGE:?required candidate image}
  runtime-controller:
    image: ${ANTNEST_RECEIPT_E2E_RC_IMAGE:?required candidate image}
    environment:
      ANTNEST_RUNTIME_SKILL_PREPARER_IMAGE: ${ANTNEST_RECEIPT_E2E_RC_IMAGE:?required candidate image}
  acp-prompt-gate:
    profiles: [stage3]
    image: node:24.21.0-bookworm-slim
    command:
      - node
      - --input-type=module
      - -e
      - >-
        import { createAcpGate } from "/tests/e2e/agent-ui/acp-gate.mjs";
        createAcpGate("http://agent-acp-workspace:8080", { capture: true, maxCaptureBytes: 8_388_608 }).listen(8080, "0.0.0.0");
    depends_on:
      agent-acp-service:
        condition: service_healthy
    volumes:
      - ./tests:/tests:ro
    ports:
      - target: 8080
        host_ip: 127.0.0.1
        protocol: tcp
    networks:
      edge:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.8
    extra_hosts:
      agent-acp-workspace: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.5
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/__fault/state').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
  agent-ui:
    environment:
      ANTNEST_AGENT_ACP_SERVICE_URL: http://acp-prompt-gate:8080
    depends_on:
      acp-prompt-gate:
        condition: service_healthy
