# Disposable admission fixture only; the browser still enters through TLS.
services:
  postgres:
    command: [postgres, -c, max_connections=200]
  identity-service:
    cpu_period: 100000
    cpu_quota: -1
    # Workload-authenticated probes bypass the diagnostic relay's shared
    # connection ceiling. Browser actions still use the real HTTPS Gateway.
    ports:
      - "127.0.0.1::8080"
    environment:
      ANTNEST_IDENTITY_LISTEN: 0.0.0.0:8080
      ANTNEST_IDENTITY_DATABASE_URL: postgres://antnest_identity:${ANTNEST_IDENTITY_POSTGRES_PASSWORD:?}@postgres:5432/antnest_identity?sslmode=disable&pool_max_conns=64&application_name=issue60-a
      ANTNEST_IDENTITY_ARGON2_MEMORY_KIB: "65536"
      ANTNEST_IDENTITY_ARGON2_ITERATIONS: "3"
      ANTNEST_IDENTITY_ARGON2_PARALLELISM: "2"
      ANTNEST_IDENTITY_ARGON2_MEMORY_BUDGET_KIB: "131072"
      ANTNEST_IDENTITY_ARGON2_MAX_CONCURRENT: "2"
