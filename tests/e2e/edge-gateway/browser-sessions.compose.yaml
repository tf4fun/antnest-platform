# Final browser acceptance tightens only the disposable Identity idle policy.
# Keep the normal policy through setup and causal revocation checks.
services:
  identity-service:
    environment:
      ANTNEST_IDENTITY_SESSION_IDLE_TTL: ${ANTNEST_BROWSER_SESSION_E2E_IDLE_TTL:-30m}
  edge-gateway:
    environment:
      ANTNEST_EDGE_LOGIN_SOURCE_MAX: "100"
      ANTNEST_EDGE_LOGIN_ACCOUNT_MAX: "100"
