# Disposable Identity profiles. Never included by retained deployment Compose.
services:
  edge-gateway:
    image: ${ANTNEST_E2E_GATEWAY_IMAGE:-antnest/edge-gateway:local}
  agent-ui:
    image: ${ANTNEST_E2E_AGENT_UI_IMAGE:-antnest/agent-ui:local}
  runtime-controller:
    image: ${ANTNEST_E2E_RUNTIME_CONTROLLER_IMAGE:-antnest/runtime-controller:local}
    environment:
      ANTNEST_RUNTIME_SKILL_PREPARER_IMAGE: ${ANTNEST_E2E_RUNTIME_CONTROLLER_IMAGE:-antnest/runtime-controller:local}
  identity-service:
    image: ${ANTNEST_E2E_IDENTITY_IMAGE:-antnest/identity-service:local}
    labels:
      io.antnest.e2e-run-id: ${ANTNEST_E2E_RUN_ID:?required}
    environment:
      ANTNEST_IDENTITY_TOKEN_TTL: ${ANTNEST_IDENTITY_ACCESS_TOKEN_TTL:-12h}
networks:
  control:
    ipam:
      config: !override
        - subnet: ${ANTNEST_EGRESS_CONTROL_SUBNET}
          ip_range: ${ANTNEST_IDENTITY_CONTROL_DYNAMIC_RANGE}
  runtime-management:
    ipam:
      config: !override
        - subnet: ${ANTNEST_RUNTIME_MANAGEMENT_SUBNET}
          ip_range: ${ANTNEST_IDENTITY_RUNTIME_DYNAMIC_RANGE}
