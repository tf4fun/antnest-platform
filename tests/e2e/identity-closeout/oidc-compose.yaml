# Test-only IdP and trust anchor. Never included by deployment Compose.
services:
  oidc-fixture:
    image: node:24-bookworm-slim
    command: ["node", "/fixture/oidc-server.mjs"]
    environment:
      OIDC_TEST_CALLBACK: ${ANTNEST_EDGE_PUBLIC_BASE_URL:?required}/protocol/oidc/callback
    volumes:
      - ./tests/e2e/identity-closeout:/fixture:ro
      - oidc-test-certs:/certs:ro
    ports:
      - 127.0.0.1:${ANTNEST_OIDC_TEST_PORT:?required}:8443
    networks: [development]
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get('https://oidc-fixture:8443/status',{ca:require('fs').readFileSync('/certs/tls.crt')},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      start_interval: 2s
      start_period: 10s
      timeout: 3s
      retries: 3
  identity-service:
    depends_on:
      oidc-fixture:
        condition: service_healthy
    environment:
      SSL_CERT_FILE: /test-ca/tls.crt
    volumes:
      - oidc-test-certs:/test-ca:ro
volumes:
  oidc-test-certs:
    name: ${COMPOSE_PROJECT_NAME:?required}-oidc-certs
