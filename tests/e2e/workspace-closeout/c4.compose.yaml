services:
  agent-ui:
    image: ${ANTNEST_C4_AGENT_UI_IMAGE:-antnest/agent-ui:local}
  agent-acp-service:
    image: ${ANTNEST_C4_AGENT_ACP_IMAGE:-antnest/agent-acp-service:local}
  edge-gateway:
    image: ${ANTNEST_C4_EDGE_GATEWAY_IMAGE:-antnest/edge-gateway:local}
  stage3-model:
    command: ["node", "/tests/e2e/workspace-closeout/c4-model.mjs"]
    volumes:
      - ./tests:/tests:ro

# Keep dynamic endpoints outside the low addresses assigned to Egress/Jaeger.
# Otherwise Compose startup order can allocate Egress's fixed .3 to a client.
networks:
  control:
    ipam:
      config: !override
        - subnet: ${ANTNEST_EGRESS_CONTROL_SUBNET}
          ip_range: ${ANTNEST_C4_CONTROL_DYNAMIC_RANGE}
  runtime-management:
    ipam:
      config: !override
        - subnet: ${ANTNEST_RUNTIME_MANAGEMENT_SUBNET}
          ip_range: ${ANTNEST_C4_RUNTIME_DYNAMIC_RANGE}
