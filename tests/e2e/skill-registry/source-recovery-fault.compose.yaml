services:
  source-recovery-rc-proxy:
    image: antnest/agent-acp-service:local
    command: ["node", "/fault/source-recovery-rc-proxy.mjs"]
    environment:
      ANTNEST_E2E_SOURCE_RECOVERY: "true"
    volumes:
      - ./tests/e2e/skill-registry:/fault:ro
    depends_on:
      runtime-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/status').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      start_interval: 1s
      start_period: 10s
      timeout: 3s
      retries: 3
    networks: [development]
  source-recovery-egress-proxy:
    image: antnest/agent-acp-service:local
    command: ["node", "/fault/source-recovery-egress-proxy.mjs"]
    environment:
      ANTNEST_EGRESS_CONTROL_IPV4: ${ANTNEST_EGRESS_CONTROL_IPV4}
    volumes:
      - ./tests/e2e/skill-registry:/fault:ro
    depends_on:
      runtime-egress:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/status').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      start_interval: 1s
      start_period: 10s
      timeout: 3s
      retries: 3
    networks: [development, control]
  agent-controller:
    environment:
      ANTNEST_RUNTIME_CONTROLLER_URL: http://source-recovery-rc-proxy:8080
      ANTNEST_RUNTIME_EGRESS_URL: http://source-recovery-egress-proxy:8081
    depends_on:
      source-recovery-rc-proxy:
        condition: service_healthy
      source-recovery-egress-proxy:
        condition: service_healthy
