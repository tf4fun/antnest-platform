services:
  runtime-controller:
    image: ${ANTNEST_E2E_RUNTIME_CONTROLLER_IMAGE:-antnest/runtime-controller:local}
  agent-acp-service:
    labels:
      io.antnest.e2e-run-id: ${ANTNEST_E2E_RUN_ID}
  agent-controller:
    image: ${ANTNEST_E2E_CONTROLLER_IMAGE:-antnest/agent-controller:local}
    environment:
      ANTNEST_AGENT_CONTROLLER_EXECUTION_RESYNC_INTERVAL: 3s
networks:
  control:
    ipam:
      config: !override
        - subnet: ${ANTNEST_EGRESS_CONTROL_SUBNET}
          ip_range: ${ANTNEST_RESTART_CONTROL_DYNAMIC_RANGE}
  runtime-management:
    ipam:
      config: !override
        - subnet: ${ANTNEST_RUNTIME_MANAGEMENT_SUBNET}
          ip_range: ${ANTNEST_RESTART_RUNTIME_DYNAMIC_RANGE}
