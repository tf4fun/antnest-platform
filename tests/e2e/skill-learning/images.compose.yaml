# Allow isolated, compatible dependency candidates without replacing local tags.
services:
  identity-service:
    image: ${ANTNEST_E2E_IDENTITY_IMAGE:-antnest/identity-service:local}
  edge-gateway:
    image: ${ANTNEST_E2E_GATEWAY_IMAGE:-antnest/edge-gateway:local}
  runtime-egress:
    image: ${ANTNEST_E2E_EGRESS_IMAGE:-antnest/runtime-egress:local}
  temporal:
    image: ${ANTNEST_E2E_TEMPORAL_IMAGE:-antnest/temporal:local}
  runtime-controller:
    image: ${ANTNEST_E2E_RUNTIME_CONTROLLER_IMAGE:-antnest/runtime-controller:local}
    environment:
      ANTNEST_RUNTIME_SKILL_PREPARER_IMAGE: ${ANTNEST_E2E_RUNTIME_CONTROLLER_IMAGE:-antnest/runtime-controller:local}
