services:
  runtime-egress:
    environment:
      ANTNEST_EGRESS_DNS_UPSTREAM: 1.1.1.1:15353
  stage3-model:
    command: ["node", "/lifecycle/network-model.mjs"]
  network-target:
    image: ${ANTNEST_ADMIN_DEFAULT_RUNTIME_IMAGE_REF:?required immutable Runtime fixture image}
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    entrypoint: ["sh", "-c"]
    command:
      - ip address replace 1.1.1.1/32 dev lo && exec node /lifecycle/network-target.mjs
    volumes:
      - ./tests/e2e/lifecycle-closeout:/lifecycle:ro
    networks: [egress]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/status').then(r=>{if(!r.ok)process.exit(1)})"]
      start_period: 10s
      start_interval: 1s
      interval: 30s
      timeout: 2s
      retries: 3
