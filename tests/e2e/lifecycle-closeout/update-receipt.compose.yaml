# Current normal-restart receipt fixture; historical crash overlay stays separate.
services:
  update-proxy:
    image: antnest/agent-acp-service:local
    command: ["node", "/fixtures/update-proxy.mjs"]
    volumes:
      - ./tests/e2e/lifecycle-closeout:/fixtures:ro
    depends_on:
      runtime-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/status').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      start_interval: 1s
      start_period: 10s
      timeout: 3s
      retries: 3
    networks:
      controller-runtime:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.60
  agent-controller:
    environment:
      ANTNEST_RUNTIME_CONTROLLER_URL: http://update-proxy:8080
    depends_on:
      update-proxy:
        condition: service_healthy
