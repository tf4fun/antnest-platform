services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: antnest_test_admin
      POSTGRES_PASSWORD: ${RC_AUTH_DATABASE_PASSWORD:?}
      POSTGRES_DB: runtime_auth_test
    networks: [control]
    healthcheck:
      test:
        [
          CMD-SHELL,
          "pg_isready -h 127.0.0.1 -U antnest_test_admin -d runtime_auth_test",
        ]
      interval: 1s
      timeout: 3s
      retries: 60
  runtime-controller:
    image: ${RC_AUTH_IMAGE:?}
    build:
      context: ../../../..
      dockerfile: services/runtime-controller/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANTNEST_RUNTIME_CONTROLLER_DATABASE_URL: postgres://antnest_test_admin:${RC_AUTH_DATABASE_PASSWORD:?}@postgres:5432/runtime_auth_test?sslmode=disable
      ANTNEST_RUNTIME_CONTROLLER_LISTEN: ${RC_AUTH_CONTROL_IP:?}:8120
      ANTNEST_RUNTIME_CONTROLLER_HEALTH_LISTEN: 127.0.0.1:8085
      ANTNEST_RUNTIME_CONTROLLER_SCOPE: ${RC_AUTH_SCOPE:?}
      ANTNEST_RUNTIME_MANAGEMENT_NETWORK: ${RC_AUTH_MANAGEMENT_NETWORK:?}
      ANTNEST_RUNTIME_INSTANCE_KEY_FILE: /run/auth/instance-master
      ANTNEST_RUNTIME_SKILL_PREPARER_IMAGE: ${RC_AUTH_IMAGE:?}
      ANTNEST_RUNTIME_SYSTEM_SKILLS_VOLUME: ${RC_AUTH_SYSTEM_SKILLS_VOLUME:?}
      ANTNEST_SERVICE_AUTH_MODE: token
      ANTNEST_SERVICE_AUTH_ALLOW_INSECURE_TRANSPORT: "true"
      ANTNEST_SERVICE_AUTH_CALLERS_FILE: /run/auth/callers.json
      OTEL_SDK_DISABLED: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RC_AUTH_DIRECTORY:?}:/run/auth:ro
      - system-skills:/fixture-system-skills:ro
    networks:
      control:
        ipv4_address: ${RC_AUTH_CONTROL_IP:?}
      management: {}
    healthcheck:
      test: [CMD, /usr/local/bin/runtime-controller, --healthcheck]
      interval: 1s
      timeout: 5s
      retries: 90
    stop_grace_period: 15s
  control-probe:
    image: node:24.21.0-bookworm-slim
    command: [node, -e, "setInterval(()=>{},60000)"]
    volumes:
      - ./probe.mjs:/fixture/probe.mjs:ro
      - ../../../../services/runtime-controller/api/control-contract.json:/fixture/control-contract.json:ro
      - ${RC_AUTH_DIRECTORY:?}:/run/auth:ro
    networks: [control]
  management-probe:
    image: node:24.21.0-bookworm-slim
    command: [node, /fixture/readiness-peer.mjs]
    volumes:
      - ./probe.mjs:/fixture/probe.mjs:ro
      - ./readiness-peer.mjs:/fixture/readiness-peer.mjs:ro
    networks:
      management:
        ipv4_address: ${RC_AUTH_READINESS_IP:?}
  instance-probe:
    image: node:24.21.0-bookworm-slim
    command: [node, -e, "setInterval(()=>{},60000)"]
    environment:
      RC_AUTH_CONTROL_ADDRESS: ${RC_AUTH_CONTROL_IP:?}:8120
    volumes:
      - ./probe.mjs:/fixture/probe.mjs:ro
      - ${RC_AUTH_DIRECTORY:?}:/run/auth:ro
    networks: [control, management]
networks:
  control:
    internal: true
    ipam:
      config:
        - subnet: ${RC_AUTH_CONTROL_SUBNET:?}
  management:
    name: ${RC_AUTH_MANAGEMENT_NETWORK:?}
    internal: true
    ipam:
      config:
        - subnet: ${RC_AUTH_MANAGEMENT_SUBNET:?}
volumes:
  system-skills:
    name: ${RC_AUTH_SYSTEM_SKILLS_VOLUME:?}
