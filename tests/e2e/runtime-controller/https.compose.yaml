services:
  runtime-egress:
    environment:
      ANTNEST_EGRESS_DNS_UPSTREAM: 1.1.1.1:15353
  egress-https-target:
    image: ${ANTNEST_E2E_RUNTIME_IMAGE:?required candidate Runtime image}
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    entrypoint: ["sh", "-c"]
    command:
      - ip address replace 1.1.1.1/32 dev lo && exec node /fixtures/runtime-controller/https-target.mjs
    environment:
      ANTNEST_EGRESS_FIXTURE_TLS_DIRECTORY: /tls
      ANTNEST_EGRESS_FIXTURE_NONCE: ${ANTNEST_EGRESS_FIXTURE_NONCE:?required fixture nonce}
    volumes:
      - ./tests/e2e:/fixtures:ro
      - type: bind
        source: ${ANTNEST_EGRESS_FIXTURE_TLS_DIRECTORY:?required disposable TLS directory}/key.pem
        target: /tls/key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ANTNEST_EGRESS_FIXTURE_TLS_DIRECTORY:?required disposable TLS directory}/cert.pem
        target: /tls/cert.pem
        read_only: true
        bind:
          create_host_path: false
    networks: [egress]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/status').then(r=>{if(!r.ok)process.exit(1)})"]
      start_period: 10s
      start_interval: 1s
      interval: 30s
      timeout: 2s
      retries: 3
