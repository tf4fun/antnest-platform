services:
  observation-docker-proxy:
    image: antnest/agent-acp-service:local
    user: "0:0"
    command: ["node", "/app/tests/e2e/runtime-controller/observation-retry-proxy.mjs"]
    environment:
      ANTNEST_DOCKER_SOCKET_GID: ${ANTNEST_DOCKER_SOCKET_GID:?ANTNEST_DOCKER_SOCKET_GID is required}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - observation-docker-socket:/fault
      - ./tests:/app/tests:ro
    ports:
      - 127.0.0.1:${ANTNEST_OBSERVATION_PROXY_HOST_PORT}:8081
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8081/status', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [observation-fault]
  # Runtime Controller listens only on its private service address; the
  # diagnostics relay is the host's loopback path to it.
  diagnostic-relay:
    ports: !override
      - "127.0.0.1:${ANTNEST_POSTGRES_HOST_PORT}:5432"
      - "127.0.0.1:${ANTNEST_RUNTIME_CONTROLLER_HOST_PORT}:58080"
  # Telemetry is disabled here, so the optional Jaeger dependency is dropped.
  runtime-egress:
    depends_on: !override
      postgres:
        condition: service_healthy
  runtime-controller:
    image: ${ANTNEST_OBSERVATION_TEST_CONTROLLER_IMAGE}
    environment:
      ANTNEST_DOCKER_HOST: unix:///fault/docker.sock
      ANTNEST_SKILL_REGISTRY_URL: ""
      # Receiver and skill volumes are prepared with the candidate image, not
      # an unrelated local tag.
      ANTNEST_RUNTIME_SKILL_PREPARER_IMAGE: ${ANTNEST_OBSERVATION_TEST_CONTROLLER_IMAGE}
    volumes:
      - observation-docker-socket:/fault
    depends_on: !override
      postgres:
        condition: service_healthy
      observation-docker-proxy:
        condition: service_healthy
networks:
  observation-fault: {}
volumes:
  observation-docker-socket: {}
