services:
  persistence-proxy:
    image: antnest/agent-acp-service:local
    command: ["node", "/fixtures/proxy.mjs"]
    volumes:
      - ./tests/e2e/acp-persistence:/fixtures:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/status').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      start_interval: 1s
      start_period: 10s
      timeout: 3s
      retries: 3
    networks: [agent-acp-database]
  agent-acp-service:
    labels:
      io.antnest.e2e-run-id: ${ANTNEST_E2E_RUN_ID}
    environment:
      ANTNEST_ACP_DATABASE_URL: postgres://antnest_agent_acp:${ANTNEST_AGENT_ACP_POSTGRES_PASSWORD:-antnest-agent-acp-dev}@persistence-proxy:5432/antnest_agent_acp
      ANTNEST_ACP_DATABASE_TIMEOUT: 60s
    depends_on:
      persistence-proxy:
        condition: service_healthy
  agent-controller:
    image: ${ANTNEST_E2E_CONTROLLER_IMAGE:-antnest/agent-controller:local}
    environment:
      ANTNEST_AGENT_CONTROLLER_EXECUTION_RESYNC_INTERVAL: 3s
networks:
  control:
    ipam:
      config: !override
        - subnet: ${ANTNEST_EGRESS_CONTROL_SUBNET}
          ip_range: ${ANTNEST_PERSISTENCE_CONTROL_DYNAMIC_RANGE}
  runtime-management:
    ipam:
      config: !override
        - subnet: ${ANTNEST_RUNTIME_MANAGEMENT_SUBNET}
          ip_range: ${ANTNEST_PERSISTENCE_RUNTIME_DYNAMIC_RANGE}
