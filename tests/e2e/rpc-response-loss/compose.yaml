services:
  admin-console:
    environment:
      # Test-only delayed export reproduction; the default remains 5 seconds.
      OTEL_BSP_SCHEDULE_DELAY: ${ANTNEST_E2E_ADMIN_SPAN_DELAY_MS:-5000}
  rpc-loss-proxy:
    image: antnest/agent-acp-service:local
    command: ["node", "/fixtures/proxy.mjs"]
    volumes:
      - ./tests/e2e/rpc-response-loss:/fixtures:ro
    depends_on:
      agent-acp-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/status').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      start_interval: 1s
      start_period: 10s
      timeout: 3s
      retries: 3
    # Agent Controller reaches ACP control through this proxy; it forwards the
    # caller's service credential to the fixed ACP control address.
    networks: [controller-acp]
    extra_hosts:
      agent-acp-control: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.34
  agent-controller:
    image: ${ANTNEST_E2E_CONTROLLER_IMAGE:-antnest/agent-controller:local}
    environment:
      ANTNEST_AGENT_ACP_CONTROL_URL: http://rpc-loss-proxy:8080
      ANTNEST_AGENT_CONTROLLER_EXECUTION_REQUEST_TIMEOUT: 120s
    depends_on:
      rpc-loss-proxy:
        condition: service_healthy
networks:
  control:
    ipam:
      config: !override
        - subnet: ${ANTNEST_EGRESS_CONTROL_SUBNET}
          ip_range: ${ANTNEST_RPC_CONTROL_DYNAMIC_RANGE}
  runtime-management:
    ipam:
      config: !override
        - subnet: ${ANTNEST_RUNTIME_MANAGEMENT_SUBNET}
          ip_range: ${ANTNEST_RPC_RUNTIME_DYNAMIC_RANGE}
