services:
  diagnostic-relay:
    ports: !override
      - "127.0.0.1:${ANTNEST_POSTGRES_HOST_PORT}:5432"
      - "127.0.0.1:${ANTNEST_JAEGER_UI_HOST_PORT}:16686"
      - "127.0.0.1:0:58080"
  stage3-model:
    image: antnest/agent-acp-service:${ANTNEST_ADMISSION_TAG:?}
    command: [node, /app/tests/e2e/managed-mcp/model.mjs]
    volumes:
      - ./tests:/app/tests:ro
    networks:
      controller-provider:
        aliases: [managed-model]
      acp-provider:
        aliases: [managed-model]
