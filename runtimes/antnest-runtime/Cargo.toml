[package]
name = "antnest-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = []
skill-maintenance-e2e-gate = []

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
http-body = "1.1.0"
futures-util = { version = "0.3.34", features = ["sink"] }
libc = "0.2.189"
multer = "3.0.0"
nix = { version = "0.31.3", features = ["fs", "process", "signal", "user"] }
opentelemetry = { version = "0.33.0", default-features = false, features = ["internal-logs", "metrics", "trace"] }
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["metrics", "trace"] }
rmcp = { version = "3.4.1", features = ["client", "macros", "schemars", "server", "transport-async-rw", "transport-streamable-http-server"] }
ring = "0.17.14"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["codec", "rt"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }
yaml-rust2 = { version = "0.13.0", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[[test]]
name = "executor_cli"
path = "../../tests/integration/antnest-runtime/executor_cli.rs"

[[test]]
name = "runtime_startup"
path = "../../tests/integration/antnest-runtime/runtime_startup.rs"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["io-std"] }
tower = { version = "0.5.3", features = ["util"] }
opentelemetry_sdk = { version = "0.33.0", features = ["metrics", "testing", "trace"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rmcp = { version = "3.4.1", features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
