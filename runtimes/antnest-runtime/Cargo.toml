[package]
name = "antnest-runtime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
axum = "0.8.8"
http-body = "1.0.1"
futures-util = { version = "0.3.31", features = ["sink"] }
libc = "0.2.183"
nix = { version = "0.30.1", features = ["fs", "process", "signal", "user"] }
opentelemetry = { version = "0.32.0", default-features = false, features = ["internal-logs", "metrics", "trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["metrics", "trace"] }
rmcp = { version = "3.1.4", features = ["client", "macros", "schemars", "server", "transport-async-rw", "transport-streamable-http-server"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.52.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["codec", "rt"] }
tracing = "0.1.43"
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
url = "2.5.8"
uuid = { version = "1.18.1", features = ["v4"] }
yaml-rust2 = { version = "0.12.0", default-features = false }

[dev-dependencies]
tokio = { version = "1.52.0", features = ["io-std"] }
opentelemetry_sdk = { version = "0.32.1", features = ["metrics", "testing", "trace"] }
reqwest = { version = "0.13.1", default-features = false, features = ["json"] }
rmcp = { version = "3.1.4", features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
