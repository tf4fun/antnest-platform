openapi: 3.1.0
info:
  title: Antnest Docker Runtime Provider Internal API
  version: 1.0.0
paths:
  /healthz:
    get:
      operationId: providerHealth
      responses:
        "200": {description: Process is alive}
  /readyz:
    get:
      operationId: providerReadiness
      responses:
        "200": {description: Docker Engine is reachable}
        "503": {$ref: "#/components/responses/Problem"}
  /internal/v1/runtimes/{agent_id}:
    parameters:
      - $ref: "#/components/parameters/AgentID"
    put:
      operationId: ensureDockerRuntime
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EnsureRequest"}
      responses:
        "200": {$ref: "#/components/responses/DriverResult"}
        "400": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /internal/v1/runtimes/{agent_id}/stop:
    parameters:
      - $ref: "#/components/parameters/AgentID"
    post:
      operationId: stopDockerRuntime
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RuntimeTarget"}
      responses:
        "200": {$ref: "#/components/responses/DriverResult"}
  /internal/v1/runtimes/{agent_id}/remove:
    parameters:
      - $ref: "#/components/parameters/AgentID"
    post:
      operationId: removeDockerRuntime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target, purge_workspace]
              properties:
                target: {$ref: "#/components/schemas/RuntimeTarget"}
                purge_workspace: {type: boolean}
      responses:
        "200": {$ref: "#/components/responses/DriverResult"}
components:
  parameters:
    AgentID:
      name: agent_id
      in: path
      required: true
      schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"}
  schemas:
    EnsureRequest:
      type: object
      additionalProperties: false
      required:
        - agent_id
        - generation
        - runtime_instance_id
        - image_ref
        - network_mode
        - network_policy_epoch
        - tunnel_ipv4
        - allocator_epoch
        - advertised_endpoint
        - egress_endpoint
        - management_network
        - dns_ipv4
        - bootstrap_token
      properties:
        agent_id: {type: string}
        generation: {type: integer, format: uint64, minimum: 1}
        runtime_instance_id: {type: string, minLength: 1}
        image_ref: {type: string, minLength: 1}
        network_mode: {type: string, enum: [restricted, unrestricted]}
        network_policy_epoch: {type: integer, format: uint64, minimum: 1}
        tunnel_ipv4: {type: string, format: ipv4}
        allocator_epoch: {type: integer, format: uint64, minimum: 1}
        advertised_endpoint: {type: string, minLength: 1}
        egress_endpoint: {type: string, minLength: 1}
        management_network: {type: string, minLength: 1}
        dns_ipv4: {type: string, format: ipv4}
        bootstrap_token: {type: string, minLength: 32}
    RuntimeTarget:
      type: object
      additionalProperties: false
      required: [agent_id, generation, runtime_instance_id]
      properties:
        agent_id: {type: string}
        generation: {type: integer, format: uint64, minimum: 1}
        runtime_instance_id: {type: string, minLength: 1}
        container_id: {type: string}
    EffectOutcome:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: {type: string, enum: [completed, not_started, unknown]}
        code: {type: string}
        detail: {type: string}
    DriverResult:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome: {$ref: "#/components/schemas/EffectOutcome"}
        container_id: {type: string}
    Problem:
      type: object
      required: [status, code, detail]
      properties:
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
  responses:
    DriverResult:
      description: Docker effect result
      content:
        application/json:
          schema: {$ref: "#/components/schemas/DriverResult"}
    Problem:
      description: Stable internal problem response
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
