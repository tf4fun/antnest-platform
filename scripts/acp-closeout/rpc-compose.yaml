services:
  rpc-loss-proxy:
    image: antnest/agent-acp-service:local
    command: ["node", "/fixtures/rpc-proxy.mjs"]
    volumes:
      - ./scripts/acp-closeout:/fixtures:ro
    depends_on:
      agent-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/status').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      start_interval: 1s
      start_period: 10s
      timeout: 3s
      retries: 3
    networks: [development]
  agent-acp-service:
    labels:
      io.antnest.e2e-run-id: ${ANTNEST_E2E_RUN_ID:?test invocation required}
    environment:
      ANTNEST_AGENT_CONTROLLER_URL: http://rpc-loss-proxy:8080
      ANTNEST_ACP_CONTROLLER_TIMEOUT: 45s
    depends_on:
      rpc-loss-proxy:
        condition: service_healthy
