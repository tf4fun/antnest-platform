# Isolated Managed MCP acceptance: no retained ports or fixed-IP allocator overlap.
services:
  temporal:
    ports: !reset []
networks:
  control:
    ipam:
      config: !override
        - subnet: ${ANTNEST_EGRESS_CONTROL_SUBNET}
          ip_range: ${ANTNEST_MANAGED_CONTROL_DYNAMIC_RANGE}
  runtime-management:
    ipam:
      config: !override
        - subnet: ${ANTNEST_RUNTIME_MANAGEMENT_SUBNET}
          ip_range: ${ANTNEST_MANAGED_RUNTIME_DYNAMIC_RANGE}
