services:
  stage3-model:
    command: ["node", "/lifecycle/network-model.mjs"]
  network-target:
    image: node:24-bookworm-slim
    command: ["node", "/lifecycle/network-target.mjs"]
    volumes:
      - ./scripts/lifecycle-closeout:/lifecycle:ro
    networks: [egress]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/status').then(r=>{if(!r.ok)process.exit(1)})"]
      start_period: 10s
      start_interval: 1s
      interval: 30s
      timeout: 2s
      retries: 3
