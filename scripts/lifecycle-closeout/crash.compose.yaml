# Opt-in abnormal process-loss diagnostic; never used by normal-restart gates.
services:
  crash-proxy:
    image: antnest/agent-acp-service:local
    user: "0:0"
    command: ["node", "/fixtures/crash-proxy.mjs"]
    volumes:
      - ./scripts/lifecycle-closeout:/fixtures:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - crash-socket:/fault
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/status').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      start_interval: 1s
      start_period: 10s
      timeout: 3s
      retries: 3
    networks: [development]
  runtime-controller:
    environment:
      ANTNEST_DOCKER_HOST: unix:///fault/docker.sock
    volumes:
      - crash-socket:/fault
    depends_on:
      crash-proxy:
        condition: service_healthy
volumes:
  crash-socket:
