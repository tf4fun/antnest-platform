# Explicit disposable-development diagnostics. Never load for a public stack.
# Every publication stays on host loopback; authentication is unchanged.
# A fixed TCP relay publishes the declared diagnostics without rebinding services.
# Product overlays do not change this explicit choice; tests use their own override.
services:
  diagnostic-relay:
    profiles: !reset []
    ports:
      - 127.0.0.1:${ANTNEST_POSTGRES_HOST_PORT:-55432}:5432
      - 127.0.0.1:${ANTNEST_TEMPORAL_HOST_PORT:-7233}:7233
      - 127.0.0.1:${ANTNEST_RUNTIME_CONTROLLER_HOST_PORT:-58080}:58080
      - 127.0.0.1:${ANTNEST_ACP_HOST_PORT:-58081}:58081
      - 127.0.0.1:${ANTNEST_IDENTITY_HOST_PORT:-58082}:58082
      - 127.0.0.1:${ANTNEST_AGENT_CONTROLLER_HOST_PORT:-58083}:58083
      - 127.0.0.1:${ANTNEST_JAEGER_UI_HOST_PORT:-16686}:16686
