name: identity-service

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - services/identity-service/**
      - modules/service-authentication/**
      - modules/secret-encryption/**
      - tests/integration/go/identity-service/**
      - tests/support/go*.mjs
      - tests/support/service-authentication*
      - tests/support/ci-ownership.json
      - contracts/identity/**
      - contracts/platform/**
      - go.work
      - go.work.sum
      - .golangci.yml
      - .nvmrc
      - .github/workflows/identity-service.yml
      - .github/workflows/_go-service.yml
      - .github/workflows/_image.yml
  pull_request:
    paths:
      - services/identity-service/**
      - modules/service-authentication/**
      - modules/secret-encryption/**
      - tests/integration/go/identity-service/**
      - tests/support/go*.mjs
      - tests/support/service-authentication*
      - tests/support/ci-ownership.json
      - contracts/identity/**
      - contracts/platform/**
      - go.work
      - go.work.sum
      - .golangci.yml
      - .nvmrc
      - .github/workflows/identity-service.yml
      - .github/workflows/_go-service.yml
      - .github/workflows/_image.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-identity-service
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'pull_request' || github.workflow == 'integration'
    uses: ./.github/workflows/_go-service.yml
    with:
      service: identity-service

  image:
    if: github.event_name != 'pull_request'
    needs: check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_image.yml
    with:
      image: antnest-identity-service
      dockerfile: services/identity-service/Dockerfile
