name: edge-gateway

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - services/edge-gateway/**
      - modules/service-authentication/**
      - tests/integration/go/edge-gateway/**
      - tests/support/go*.mjs
      - tests/support/service-authentication*
      - tests/support/ci-ownership.json
      - contracts/admin-console/**
      - contracts/agent-ui/**
      - contracts/edge-gateway/**
      - contracts/identity/**
      - contracts/platform/**
      - go.work
      - go.work.sum
      - .golangci.yml
      - .nvmrc
      - .github/workflows/edge-gateway.yml
      - .github/workflows/_go-service.yml
      - .github/workflows/_image.yml
  pull_request:
    paths:
      - services/edge-gateway/**
      - modules/service-authentication/**
      - tests/integration/go/edge-gateway/**
      - tests/support/go*.mjs
      - tests/support/service-authentication*
      - tests/support/ci-ownership.json
      - contracts/admin-console/**
      - contracts/agent-ui/**
      - contracts/edge-gateway/**
      - contracts/identity/**
      - contracts/platform/**
      - go.work
      - go.work.sum
      - .golangci.yml
      - .nvmrc
      - .github/workflows/edge-gateway.yml
      - .github/workflows/_go-service.yml
      - .github/workflows/_image.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-edge-gateway
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'pull_request' || github.workflow == 'integration'
    uses: ./.github/workflows/_go-service.yml
    with:
      service: edge-gateway

  image:
    if: github.event_name != 'pull_request'
    needs: check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_image.yml
    with:
      image: antnest-edge-gateway
      dockerfile: services/edge-gateway/Dockerfile
