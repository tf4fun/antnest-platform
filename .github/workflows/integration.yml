name: integration

# Component, browser and service-owned Docker E2E suites. The workflow has no
# path filter; tests/support/ci-changes.mjs selects the suites a change
# exercises and groups them into one job per shard of each tier.
# tests/support/ci-mode.mjs runs them when a pull request is opened, reopened
# or marked ready, or labeled `ci:full`; other pushes to a pull request run
# only the repository and service workflows.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
  workflow_dispatch:
    inputs:
      suites:
        description: Suite ids to run (comma or space separated); empty runs every suite.
        default: ""
        type: string

permissions:
  contents: read

# An unrelated label gets its own group so it cannot cancel a full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci:full' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select suites
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      suites: ${{ steps.select.outputs.suites }}
      plain: ${{ steps.select.outputs.plain }}
      image_suites: ${{ steps.select.outputs.image_suites }}
      imaged: ${{ steps.select.outputs.imaged }}
      optional_suites: ${{ steps.select.outputs.optional_suites }}
      optional: ${{ steps.select.outputs.optional }}
      images: ${{ steps.select.outputs.images }}
      builds: ${{ steps.select.outputs.builds }}
      building: ${{ steps.select.outputs.building }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Select mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABEL: ${{ github.event.label.name }}
        run: node tests/support/ci-mode.mjs >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: steps.mode.outputs.mode == 'full'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A push whose previous head is unknown (new branch, force push) and a
      # manual run both select every suite, unless the manual run names
      # suites. Images are named by a hash of
      # their build inputs; any that GHCR lacks are built by the image job.
      # Runs on main resolve every image so the image job publishes it.
      - name: Select suites
        id: select
        if: steps.mode.outputs.mode == 'full'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          ONLY: ${{ inputs.suites }}
        run: |
          set -- --resolve-images
          [ "$PUBLISH" = true ] && set -- "$@" --all-images
          [ -n "$ONLY" ] && set -- "$@" --only "$ONLY"
          if [ "$EVENT" != workflow_dispatch ] && [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            node tests/support/ci-changes.mjs "$@" --base "$BASE" --head HEAD
          else
            node tests/support/ci-changes.mjs "$@" --all
          fi

  images:
    name: Image / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.mode == 'full' && needs.changes.outputs.building != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: docker/setup-buildx-action@v3

      - name: Write image definition
        env:
          NAME: ${{ matrix.name }}
        run: node tests/support/ci-changes.mjs --bake "$NAME" > "$RUNNER_TEMP/image.docker-bake.json"

      - name: Build image
        uses: docker/bake-action@v6
        with:
          source: .
          files: ${{ runner.temp }}/image.docker-bake.json
          load: true

      - name: Save image
        env:
          NAME: ${{ matrix.name }}
        run: |
          set -o pipefail
          docker save "antnest/$NAME:local" | zstd -T0 -3 -o "$RUNNER_TEMP/$NAME.tar.zst"
          ls -l "$RUNNER_TEMP/$NAME.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.tar.zst
          compression-level: 0
          retention-days: 1

      # Only main publishes, so a pull request cannot place an image under a
      # reference that later runs trust.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          NAME: ${{ matrix.name }}
          REF: ${{ matrix.ref }}
        run: |
          docker tag "antnest/$NAME:local" "$REF"
          docker push "$REF"

  # Shards without images start at once; the others wait for the image job.
  suite:
    name: Tier ${{ matrix.tier }} / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.mode == 'full' && needs.changes.outputs.plain != '0'
    permissions:
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.suites) }}
    uses: ./.github/workflows/_suite.yml
    with:
      suite: ${{ toJSON(matrix) }}

  image-suite:
    name: Tier ${{ matrix.tier }} / ${{ matrix.name }}
    needs: [changes, images]
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.mode == 'full' &&
      needs.changes.outputs.imaged != '0' &&
      (needs.images.result == 'success' || needs.images.result == 'skipped')
    permissions:
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.image_suites) }}
    uses: ./.github/workflows/_suite.yml
    with:
      suite: ${{ toJSON(matrix) }}
      images: ${{ needs.changes.outputs.images }}

  # Tier C reports each shard but is not part of `Integration checks` until
  # it is stable. The parallel cap leaves runners for the required shards.
  optional-suite:
    name: Tier ${{ matrix.tier }} / ${{ matrix.name }}
    needs: [changes, images]
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.mode == 'full' &&
      needs.changes.outputs.optional != '0' &&
      (needs.images.result == 'success' || needs.images.result == 'skipped')
    permissions:
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.changes.outputs.optional_suites) }}
    uses: ./.github/workflows/_suite.yml
    with:
      suite: ${{ toJSON(matrix) }}
      images: ${{ needs.changes.outputs.images }}

  integration:
    # GitHub counts a skipped required job as passing, so a run that selects
    # nothing reports under another name and `Integration checks` stays
    # pending until a full run covers this head.
    name: ${{ needs.changes.outputs.mode == 'full' && 'Integration checks' || 'Integration checks (not run)' }}
    needs: [changes, images, suite, image-suite]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A skipped job is a pass only when it had nothing to do.
      - name: Check suite results
        env:
          CHANGES: ${{ needs.changes.result }}
          MODE: ${{ needs.changes.outputs.mode }}
          IMAGES: ${{ needs.images.result }}
          SUITE: ${{ needs.suite.result }}
          IMAGE_SUITE: ${{ needs.image-suite.result }}
          BUILDING: ${{ needs.changes.outputs.building }}
          PLAIN: ${{ needs.changes.outputs.plain }}
          IMAGED: ${{ needs.changes.outputs.imaged }}
        run: |
          echo "changes=$CHANGES images=$IMAGES/$BUILDING suite=$SUITE/$PLAIN image-suite=$IMAGE_SUITE/$IMAGED"
          [ "$CHANGES" = success ] || exit 1
          if [ "$MODE" != full ]; then
            echo "::notice::Integration suites did not run ($MODE). Add the ci:full label to run them on this commit."
            exit 0
          fi
          expect() { if [ "$2" = 0 ]; then [ "$1" = skipped ]; else [ "$1" = success ]; fi; }
          expect "$IMAGES" "$BUILDING"
          expect "$SUITE" "$PLAIN"
          expect "$IMAGE_SUITE" "$IMAGED"

  # The label requests one full run; removing it lets a later push be
  # covered by adding it again. Fork pull requests get a read-only token.
  release-label:
    name: Release ci:full label
    if: github.event.action == 'labeled' && github.event.label.name == 'ci:full'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Remove label
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --remove-label 'ci:full'
