name: integration

# Required component CI only. System E2E lives in e2e.yml and never contributes
# to this workflow's required Integration checks status.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      suites:
        description: Component suite ids; empty selects all component suites.
        default: ""
        type: string

permissions:
  contents: read

# GitHub checks a required status against the newest run of this workflow for
# the head commit, so only events that select a mode trigger it and a newer
# head cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select suites
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      services: ${{ steps.select.outputs.services }}
      suites: ${{ steps.select.outputs.suites }}
      plain: ${{ steps.select.outputs.plain }}
      image_suites: ${{ steps.select.outputs.image_suites }}
      imaged: ${{ steps.select.outputs.imaged }}
      images: ${{ steps.select.outputs.images }}
      builds: ${{ steps.select.outputs.builds }}
      building: ${{ steps.select.outputs.building }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Select mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: node tests/support/ci-mode.mjs >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        if: steps.mode.outputs.mode == 'component'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scope is intersected with selection, including explicit manual ids.
      # Missing history conservatively selects every component, never E2E.
      - name: Select suites
        id: select
        if: steps.mode.outputs.mode == 'component'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          ONLY: ${{ inputs.suites }}
        run: |
          set -- --scope component --resolve-images
          [ -n "$ONLY" ] && set -- "$@" --only "$ONLY"
          if [ "$EVENT" != workflow_dispatch ] && [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            node tests/support/ci-changes.mjs "$@" --base "$BASE" --head HEAD
          else
            node tests/support/ci-changes.mjs "$@" --all
          fi

  unit-admin-console:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services || '[]'), 'admin-console')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/admin-console.yml

  unit-agent-acp-service:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services || '[]'), 'agent-acp-service')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/agent-acp-service.yml

  unit-agent-controller:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services || '[]'), 'agent-controller')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/agent-controller.yml

  unit-agent-ui:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services || '[]'), 'agent-ui')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/agent-ui.yml

  unit-antnest-runtime:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services || '[]'), 'antnest-runtime')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/runtime.yml

  unit-edge-gateway:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services || '[]'), 'edge-gateway')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/edge-gateway.yml

  unit-identity-service:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services || '[]'), 'identity-service')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/identity-service.yml

  unit-runtime-controller:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services || '[]'), 'runtime-controller')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/runtime-controller.yml

  unit-runtime-egress:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services || '[]'), 'runtime-egress')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/runtime-egress.yml

  unit-skill-registry:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services || '[]'), 'skill-registry')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/skill-registry.yml

  images:
    name: Image / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.mode == 'component' && needs.changes.outputs.building != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.builds) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: docker/setup-buildx-action@v4

      - name: Write image definition
        env:
          NAME: ${{ matrix.name }}
        run: node tests/support/ci-changes.mjs --bake "$NAME" > "$RUNNER_TEMP/image.docker-bake.json"

      - name: Build image
        uses: docker/bake-action@v7
        with:
          source: .
          files: ${{ runner.temp }}/image.docker-bake.json
          load: true

      - name: Save image
        env:
          NAME: ${{ matrix.name }}
        run: |
          set -o pipefail
          docker save "antnest/$NAME:local" | zstd -T0 -3 -o "$RUNNER_TEMP/$NAME.tar.zst"
          ls -l "$RUNNER_TEMP/$NAME.tar.zst"

      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.tar.zst
          compression-level: 0
          retention-days: 1

  # Shards without images start at once; the others wait for the image job.
  suite:
    name: Tier ${{ matrix.tier }} / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.mode == 'component' && needs.changes.outputs.plain != '0'
    permissions:
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.suites) }}
    uses: ./.github/workflows/_suite.yml
    with:
      suite: ${{ toJSON(matrix) }}

  image-suite:
    name: Tier ${{ matrix.tier }} / ${{ matrix.name }}
    needs: [changes, images]
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.mode == 'component' &&
      needs.changes.outputs.imaged != '0' &&
      (needs.images.result == 'success' || needs.images.result == 'skipped')
    permissions:
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.image_suites) }}
    uses: ./.github/workflows/_suite.yml
    with:
      suite: ${{ toJSON(matrix) }}
      images: ${{ needs.changes.outputs.images }}

  integration:
    # Drafts and partial manual runs report under other names. Event-based
    # naming keeps selection failures on the required check even before the
    # mode output exists.
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Integration checks (not run)' || github.event_name == 'workflow_dispatch' && inputs.suites != '' && 'Integration checks (partial)' || 'Integration checks' }}
    needs:
      - changes
      - images
      - suite
      - image-suite
      - unit-admin-console
      - unit-agent-acp-service
      - unit-agent-controller
      - unit-agent-ui
      - unit-antnest-runtime
      - unit-edge-gateway
      - unit-identity-service
      - unit-runtime-controller
      - unit-runtime-egress
      - unit-skill-registry
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A skipped job is a pass only when it had nothing to do.
      - name: Check suite results
        env:
          CHANGES: ${{ needs.changes.result }}
          MODE: ${{ needs.changes.outputs.mode }}
          IMAGES: ${{ needs.images.result }}
          SUITE: ${{ needs.suite.result }}
          IMAGE_SUITE: ${{ needs.image-suite.result }}
          BUILDING: ${{ needs.changes.outputs.building }}
          PLAIN: ${{ needs.changes.outputs.plain }}
          IMAGED: ${{ needs.changes.outputs.imaged }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          SERVICES: ${{ needs.changes.outputs.services }}
          UNIT_RESULTS: ${{ toJSON(needs) }}
        run: |
          [ "$CHANGES" = success ] || exit 1
          echo "changes=$CHANGES images=$IMAGES/$BUILDING suite=$SUITE/$PLAIN image-suite=$IMAGE_SUITE/$IMAGED"
          case "$MODE" in
            component) ;;
            light)
              [ "$EVENT" = pull_request ] && [ "$DRAFT" = true ] || exit 1
              echo "::notice::Integration suites did not run ($MODE). Mark the pull request ready for review to run them."
              exit 0
              ;;
            *) exit 1 ;;
          esac
          expect() {
            [[ "$2" =~ ^(0|[1-9][0-9]*)$ ]] || return 1
            if [ "$2" = 0 ]; then [ "$1" = skipped ]; else [ "$1" = success ]; fi
          }
          expect "$IMAGES" "$BUILDING"
          expect "$SUITE" "$PLAIN"
          expect "$IMAGE_SUITE" "$IMAGED"
          node --input-type=module <<'JS'
          const known = [
            "admin-console", "agent-acp-service", "agent-controller", "agent-ui",
            "antnest-runtime", "edge-gateway", "identity-service",
            "runtime-controller", "runtime-egress", "skill-registry",
          ];
          const selected = JSON.parse(process.env.SERVICES);
          const results = JSON.parse(process.env.UNIT_RESULTS);
          if (!Array.isArray(selected) || selected.some(name => !known.includes(name)) ||
              new Set(selected).size !== selected.length) process.exit(1);
          for (const name of known) {
            const expected = selected.includes(name) ? "success" : "skipped";
            if (results[`unit-${name}`]?.result !== expected) {
              console.error(`Unit checks for ${name} did not report ${expected}`);
              process.exit(1);
            }
          }
          JS

      - name: Reject workflow cancellation
        if: cancelled()
        run: exit 1

  timing:
    name: Report workflow timing
    continue-on-error: true
    needs: [changes, integration]
    if: always() && needs.changes.outputs.mode == 'component'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Measure completed integration jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/support/ci-timing.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-timing
          path: artifacts/verification/ci-timing/timing.json
          if-no-files-found: ignore
          retention-days: 14
