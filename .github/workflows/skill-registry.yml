name: skill-registry

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - services/skill-registry/**
      - tests/integration/go/skill-registry/**
      - tests/integration/skill-registry/**
      - tests/support/**
      - contracts/**
      - go.work
      - go.work.sum
      - .golangci.yml
      - .nvmrc
      - .github/workflows/skill-registry.yml
      - .github/workflows/_go-service.yml
      - .github/workflows/_image.yml
  pull_request:
    paths:
      - services/skill-registry/**
      - tests/integration/go/skill-registry/**
      - tests/integration/skill-registry/**
      - tests/support/**
      - contracts/**
      - go.work
      - go.work.sum
      - .golangci.yml
      - .nvmrc
      - .github/workflows/skill-registry.yml
      - .github/workflows/_go-service.yml
      - .github/workflows/_image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: ./.github/workflows/_go-service.yml
    with:
      service: skill-registry

  image:
    needs: check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_image.yml
    with:
      image: antnest-skill-registry
      dockerfile: services/skill-registry/Dockerfile
