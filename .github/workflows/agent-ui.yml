name: agent-ui

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - services/agent-ui/**
      - tests/integration/agent-ui/**
      - services/agent-acp-service/package-lock.json
      - contracts/agent-acp/**
      - contracts/agent-controller/**
      - contracts/agent-ui/**
      - contracts/edge-gateway/**
      - contracts/identity/**
      - contracts/platform/**
      - contracts/skill-learning/**
      - tests/support/ci-ownership.json
      - .nvmrc
      - .github/workflows/agent-ui.yml
      - .github/workflows/_image.yml
  pull_request:
    paths:
      - services/agent-ui/**
      - tests/integration/agent-ui/**
      - services/agent-acp-service/package-lock.json
      - contracts/agent-acp/**
      - contracts/agent-controller/**
      - contracts/agent-ui/**
      - contracts/edge-gateway/**
      - contracts/identity/**
      - contracts/platform/**
      - contracts/skill-learning/**
      - tests/support/ci-ownership.json
      - .nvmrc
      - .github/workflows/agent-ui.yml
      - .github/workflows/_image.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-agent-ui
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'pull_request' || github.workflow == 'integration'
    name: Typecheck and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/agent-ui/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            services/agent-ui/web/package-lock.json
            services/agent-acp-service/package-lock.json

      - run: npm ci

      # Contract tests validate with the ACP service's locked Ajv and ACP SDK schema.
      - name: Install ACP contract tooling
        run: npm --prefix ../../agent-acp-service ci

      - run: npm run typecheck

      - run: npm test

      - name: Bridge integration tests
        run: npm run test:bridge:integration

  image:
    if: github.event_name != 'pull_request'
    needs: check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_image.yml
    with:
      image: antnest-agent-ui
      dockerfile: services/agent-ui/Dockerfile
