name: ci

# Repository-wide checks. Each service has its own path-filtered workflow for
# lint, unit tests, and its container image.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            services/agent-acp-service/package-lock.json
            services/agent-ui/web/package-lock.json
            services/admin-console/web/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/runtime-controller/go.mod
          cache: false

      # Root test sources are formatted and linted with the ACP service's
      # locked Prettier and ESLint installation.
      - name: Install shared Node tooling
        run: npm --prefix services/agent-acp-service ci

      # Browser E2E entry points import Playwright from the web packages, and
      # the workspace recorder fixture drives a headless Chromium.
      - name: Install web packages
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm --prefix services/agent-ui/web ci
          npm --prefix services/admin-console/web ci

      - name: Install headless Chromium
        timeout-minutes: 28
        run: sh tests/support/ci-install-chromium.sh services/agent-ui/web/node_modules/.bin/playwright

      - name: Markdown links
        run: make check-links

      - name: Storage policy
        run: make test-storage-policy

      - name: Root test source syntax
        run: find tests -name '*.mjs' -type f -print0 | xargs -0 -n1 node --check

      - name: Root test source formatting
        run: services/agent-acp-service/node_modules/.bin/prettier --check 'tests/**/*.mjs' 'tests/**/*.ts'

      - name: Contract, tooling, and fixture suites
        run: make test-repo
