name: antnest-runtime

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - modules/runtime-tunnel/**
      - tests/support/runtime-tunnel/**
      - runtimes/antnest-runtime/**
      - tests/integration/antnest-runtime/**
      - tests/integration/skill-registry/package-rules-v1.json
      - contracts/runtime/**
      - contracts/platform/service-token-fixtures.json
      - tests/e2e/service-authentication/runtime/**
      - .github/workflows/runtime.yml
      - .github/workflows/_rust-crate.yml
      - .github/workflows/_image.yml
  pull_request:
    paths:
      - modules/runtime-tunnel/**
      - tests/support/runtime-tunnel/**
      - runtimes/antnest-runtime/**
      - tests/integration/antnest-runtime/**
      - tests/integration/skill-registry/package-rules-v1.json
      - contracts/runtime/**
      - contracts/platform/service-token-fixtures.json
      - tests/e2e/service-authentication/runtime/**
      - .github/workflows/runtime.yml
      - .github/workflows/_rust-crate.yml
      - .github/workflows/_image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: ./.github/workflows/_rust-crate.yml
    with:
      crate-path: runtimes/antnest-runtime
      integration-path: tests/integration/antnest-runtime
      apt-packages: libnftables-dev pkg-config
      extra-test-args: --example managed-mcp-fixture

  check-test-features:
    needs: check
    uses: ./.github/workflows/_rust-crate.yml
    with:
      crate-path: runtimes/antnest-runtime
      integration-path: tests/integration/antnest-runtime
      apt-packages: libnftables-dev pkg-config
      extra-test-args: --features skill-maintenance-e2e-gate

  # The default, last Docker target is release. Its build never reads the
  # feature argument; only explicitly selected E2E targets can enable it.
  image:
    needs: [check, check-test-features]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_image.yml
    with:
      image: antnest-runtime
      dockerfile: runtimes/antnest-runtime/Dockerfile
