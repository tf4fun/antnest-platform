name: Diagnose issue 69 CodeQL flow
on:
  push:
    branches: [diagnose/issue-69-codeql]
permissions:
  contents: read
  security-events: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read the exact CodeQL alert and source flow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/code-scanning/alerts?ref=refs/pull/617/head&state=open&per_page=100" --jq '[.[] | {number,rule:.rule.id,most_recent_instance}]'
          gh api -H 'Accept: application/sarif+json' "repos/$REPO/code-scanning/analyses/2131718414" | jq '.runs[].results[] | select(.ruleId == "go/reflected-xss") | {ruleId,message,locations,flows:[.codeFlows[].threadFlows[].locations[].location | {message,physicalLocation}]}'
