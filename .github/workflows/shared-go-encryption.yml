name: shared-go-encryption

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - modules/secret-encryption/**
      - contracts/platform/encryption-key-rotation.md
      - .golangci.yml
      - .github/workflows/shared-go-encryption.yml
  pull_request:
    paths:
      - modules/secret-encryption/**
      - contracts/platform/encryption-key-rotation.md
      - .golangci.yml
      - .github/workflows/shared-go-encryption.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOWORK: "off"
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: modules/secret-encryption
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: modules/secret-encryption/go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(find . -name '*.go' -type f -print0 | xargs -0 gofmt -l)"
      - name: Install golangci-lint
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
      - name: golangci-lint
        run: golangci-lint run --config ../../.golangci.yml ./...
      - name: go vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race -count=1 ./...
