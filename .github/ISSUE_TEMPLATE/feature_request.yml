name: Feature request
description: Propose new behavior or a change to an existing contract.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Changes that cross a service boundary start with the contract under
        `contracts/`. See [CONTRIBUTING.md](https://github.com/tf4fun/antnest-platform/blob/main/CONTRIBUTING.md)
        for how changes are split across services.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what prevents it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the behavior you want, not only the implementation.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owning service
      description: Which service should own the new behavior or data, if you know.
      placeholder: agent-controller
  - type: textarea
    id: contracts
    attributes:
      label: Contract impact
      description: APIs, schemas, events or storage that would change, and any compatibility concerns.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
