[package]
name = "antnest-runtime-egress"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
async-trait = "0.1.89"
axum = "0.8.8"
ipnet = { version = "2.12.0", features = ["serde"] }
libc = "0.2.183"
opentelemetry = { version = "0.32.0", default-features = false, features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["metrics", "trace"] }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.52.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7.15", features = ["with-serde_json-1"] }
tokio-postgres-rustls = "0.13.0"
tokio-util = { version = "0.7.18", features = ["rt"] }
tower = "0.5.3"
tracing = "0.1.43"
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
http-body-util = "0.1.3"
opentelemetry_sdk = { version = "0.32.1", features = ["metrics", "testing", "trace"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
