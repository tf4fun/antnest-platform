name: antnest-platform

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: antnest_egress
      POSTGRES_USER: antnest_egress
      POSTGRES_PASSWORD: ${ANTNEST_EGRESS_POSTGRES_PASSWORD:-antnest-egress-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antnest_egress -d antnest_egress"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - egress-postgres:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${ANTNEST_EGRESS_POSTGRES_HOST_PORT:-55432}:5432
    networks: [control, development]

  runtime-egress:
    image: antnest/runtime-egress:local
    build:
      context: .
      dockerfile: services/runtime-egress/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANTNEST_EGRESS_DATABASE_URL: postgres://antnest_egress:${ANTNEST_EGRESS_POSTGRES_PASSWORD:-antnest-egress-dev}@postgres:5432/antnest_egress
      ANTNEST_EGRESS_DATABASE_TLS_MODE: disable
      ANTNEST_EGRESS_CONTROL_LISTEN: ${ANTNEST_EGRESS_CONTROL_IPV4:-172.31.255.3}:8081
      ANTNEST_EGRESS_UDP_ADVERTISE: ${ANTNEST_EGRESS_IPV4:-172.30.255.3}:8092
      ANTNEST_EGRESS_TUNNEL_CIDR: 100.64.0.0/10
      ANTNEST_EGRESS_RESOLVER_IPV4: 100.64.0.1
      ANTNEST_EGRESS_DNS_UPSTREAM: ${ANTNEST_EGRESS_DNS_UPSTREAM:-127.0.0.11:53}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://127.0.0.1:4318}
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
    devices:
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://${ANTNEST_EGRESS_CONTROL_IPV4:-172.31.255.3}:8081/status | grep -q '\"status\":\"ready\"'"]
      interval: 5s
      timeout: 2s
      retries: 12
    networks:
      control:
        ipv4_address: ${ANTNEST_EGRESS_CONTROL_IPV4:-172.31.255.3}
      egress: {}
      runtime-management:
        ipv4_address: ${ANTNEST_EGRESS_IPV4:-172.30.255.3}
    stop_grace_period: 10s

networks:
  control:
    internal: true
    ipam:
      config:
        - subnet: ${ANTNEST_EGRESS_CONTROL_SUBNET:-172.31.255.0/24}
  development: {}
  egress: {}
  runtime-management:
    name: ${ANTNEST_RUNTIME_MANAGEMENT_NETWORK:-antnest-runtime-management}
    internal: true
    ipam:
      config:
        - subnet: ${ANTNEST_RUNTIME_MANAGEMENT_SUBNET:-172.30.255.0/24}

volumes:
  egress-postgres:
