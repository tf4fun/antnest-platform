          ${ANTNEST_SERVICE_AUTH_DIRECTORY:?prepare development authentication with
          scripts/dev-service-tokens.mjs}/edge-gateway/tokens
        target: /etc/antnest/service-auth/tokens
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      identity-service: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.66
      admin-console: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.3
      agent-ui: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.4
      agent-controller: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.18
      agent-acp-workspace: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.5
      jaeger: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.114

  jaeger:
    profiles: [observability]
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
    networks:
      observability:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.114
  diagnostic-relay:
    profiles:
      - diagnostics
    image: node:24.21.0-bookworm-slim
    user: 65532:65532
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - node
      - /opt/antnest/scripts/deployment/diagnostic-relay.mjs
    environment:
      ANTNEST_SERVICE_NETWORK_PREFIX: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}
    volumes:
      - type: bind
        source: ./scripts/deployment
        target: /opt/antnest/scripts/deployment
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./contracts/platform/development-network-contract.json
        target: /opt/antnest/contracts/platform/development-network-contract.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const
          n=require('node:net').connect(5432,process.env.ANTNEST_SERVICE_NETWORK_PREFIX+'.146',()=>n.end());n.on('error',()=>process.exit(1))
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    networks:
      edge:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.7
      controller-clients:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.23
      controller-runtime:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.52
      identity-clients:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.73
      temporal-clients:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.101
      observability:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.125
      diagnostic-ingress:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.146
        gw_priority: 1
      postgres-diagnostics:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.163
    stop_grace_period: 10s
  runtime-telemetry-ingress:
    profiles:
      - observability
    depends_on:
      jaeger:
        condition: service_started
    image: node:24.21.0-bookworm-slim
    user: 65532:65532
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - node
      - /opt/antnest/scripts/deployment/runtime-telemetry-ingress.mjs
    environment:
      ANTNEST_SERVICE_NETWORK_PREFIX: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}
      ANTNEST_RUNTIME_OTLP_INGRESS_IPV4: ${ANTNEST_RUNTIME_OTLP_INGRESS_IPV4:-172.30.255.4}
    volumes:
      - type: bind
        source: ./scripts/deployment
        target: /opt/antnest/scripts/deployment
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./contracts/platform/development-network-contract.json
        target: /opt/antnest/contracts/platform/development-network-contract.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://'+process.env.ANTNEST_RUNTIME_OTLP_INGRESS_IPV4+':4318/v1/traces').then(r=>{if(r.status!==405)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    networks:
      observability:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.124
      runtime-management:
        ipv4_address: ${ANTNEST_RUNTIME_OTLP_INGRESS_IPV4:-172.30.255.4}
    stop_grace_period: 10s

