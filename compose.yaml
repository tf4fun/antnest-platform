name: antnest-platform

# Stored-secret owners validate exactly one encryption mode before startup.
# Do not duplicate the choice with nested required-value interpolation: Compose
# 2.38 evaluates the unused required branch even when a single key is configured.

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: antnest_test_admin
      POSTGRES_PASSWORD: ${ANTNEST_POSTGRES_ADMIN_PASSWORD:?ANTNEST_POSTGRES_ADMIN_PASSWORD is required; run scripts/generate-dev-env.sh}
      ANTNEST_EGRESS_POSTGRES_PASSWORD: ${ANTNEST_EGRESS_POSTGRES_PASSWORD:?ANTNEST_EGRESS_POSTGRES_PASSWORD is required; run scripts/generate-dev-env.sh}
      ANTNEST_RUNTIME_CONTROLLER_POSTGRES_PASSWORD: ${ANTNEST_RUNTIME_CONTROLLER_POSTGRES_PASSWORD:?ANTNEST_RUNTIME_CONTROLLER_POSTGRES_PASSWORD is required; run scripts/generate-dev-env.sh}
      ANTNEST_AGENT_ACP_POSTGRES_PASSWORD: ${ANTNEST_AGENT_ACP_POSTGRES_PASSWORD:?ANTNEST_AGENT_ACP_POSTGRES_PASSWORD is required; run scripts/generate-dev-env.sh}
      ANTNEST_IDENTITY_POSTGRES_PASSWORD: ${ANTNEST_IDENTITY_POSTGRES_PASSWORD:?ANTNEST_IDENTITY_POSTGRES_PASSWORD is required; run scripts/generate-dev-env.sh}
      ANTNEST_AGENT_CONTROLLER_POSTGRES_PASSWORD: ${ANTNEST_AGENT_CONTROLLER_POSTGRES_PASSWORD:?ANTNEST_AGENT_CONTROLLER_POSTGRES_PASSWORD is required; run scripts/generate-dev-env.sh}
    healthcheck:
      test: [
          "CMD-SHELL",
          'test -f "$$PGDATA/.antnest-init-complete" && pg_isready -h 127.0.0.1 -U
          antnest_test_admin -d postgres',
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-antnest-services.sh:ro
    networks:
      postgres-diagnostics:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.162
      egress-database: {}
      runtime-controller-database: {}
      agent-acp-database: {}
      identity-database: {}
      agent-controller-database: {}
      skill-registry-database: {}
      temporal-database: {}

  temporal-databases:
    profiles: [stage2, stage3]
    image: postgres:17.11-bookworm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: antnest_test_admin
      PGPASSWORD: ${ANTNEST_POSTGRES_ADMIN_PASSWORD:?ANTNEST_POSTGRES_ADMIN_PASSWORD is required; run scripts/generate-dev-env.sh}
      ANTNEST_TEMPORAL_POSTGRES_PASSWORD: ${ANTNEST_TEMPORAL_POSTGRES_PASSWORD:?ANTNEST_TEMPORAL_POSTGRES_PASSWORD is required; run scripts/generate-dev-env.sh}
    entrypoint: [sh, /scripts/init-databases.sh]
    volumes:
      - ./scripts/temporal/init-databases.sh:/scripts/init-databases.sh:ro
    networks:
      temporal-database: {}

  temporal-schema:
    profiles: [stage2, stage3]
    image: temporalio/admin-tools:1.32.0
    depends_on:
      temporal-databases:
        condition: service_completed_successfully
    environment:
      SQL_PASSWORD: ${ANTNEST_TEMPORAL_POSTGRES_PASSWORD:?ANTNEST_TEMPORAL_POSTGRES_PASSWORD is required; run scripts/generate-dev-env.sh}
    entrypoint: [sh, /scripts/setup-schema.sh]
    volumes:
      - ./scripts/temporal/setup-schema.sh:/scripts/setup-schema.sh:ro
    networks:
      temporal-database: {}

  temporal:
    profiles: [stage2, stage3]
    image: antnest/temporal:local
    build:
      context: .
      dockerfile: scripts/temporal/Dockerfile
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      DBNAME: antnest_temporal
      VISIBILITY_DBNAME: antnest_temporal_visibility
      POSTGRES_USER: antnest_temporal
      POSTGRES_PWD: ${ANTNEST_TEMPORAL_POSTGRES_PASSWORD:?ANTNEST_TEMPORAL_POSTGRES_PASSWORD is required; run scripts/generate-dev-env.sh}
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      # All Temporal server roles share this container; keep gossip independent
      # of Docker interface IP reallocation during a normal stop/start.
      TEMPORAL_BROADCAST_ADDRESS: 127.0.0.1
      NUM_HISTORY_SHARDS: 4
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/docker.yaml
    volumes:
      - ./scripts/temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/docker.yaml:ro
    healthcheck:
      test: [CMD, sh, /etc/temporal/readiness.sh]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      start_interval: 2s
    networks:
      temporal-clients:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.98
      temporal-database: {}
    stop_grace_period: 30s

  temporal-namespace:
    profiles: [stage2, stage3]
    image: temporalio/admin-tools:1.32.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    entrypoint: [sh, /scripts/setup-namespace.sh]
    volumes:
      - ./scripts/temporal/setup-namespace.sh:/scripts/setup-namespace.sh:ro
    networks:
      temporal-clients:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.100
    extra_hosts:
      temporal: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.98

  runtime-egress:
    image: antnest/runtime-egress:local
    build:
      context: .
      dockerfile: services/runtime-egress/Dockerfile
    depends_on:
      jaeger:
        condition: service_started
        required: false
      postgres:
        condition: service_healthy
    environment:
      ANTNEST_EGRESS_DATABASE_URL: postgres://antnest_egress:${ANTNEST_EGRESS_POSTGRES_PASSWORD:?ANTNEST_EGRESS_POSTGRES_PASSWORD is required; run scripts/generate-dev-env.sh}@postgres:5432/antnest_egress
      ANTNEST_EGRESS_DATABASE_TLS_MODE: disable
      ANTNEST_EGRESS_CONTROL_LISTEN: ${ANTNEST_EGRESS_CONTROL_IPV4:-172.31.255.3}:8081
      ANTNEST_EGRESS_UDP_ADVERTISE: ${ANTNEST_EGRESS_IPV4:-172.30.255.3}:8092
      ANTNEST_EGRESS_TUNNEL_CIDR: 100.64.0.0/10
      ANTNEST_EGRESS_RESOLVER_IPV4: 100.64.0.1
      ANTNEST_EGRESS_DNS_UPSTREAM: ${ANTNEST_EGRESS_DNS_UPSTREAM:-127.0.0.11:53}
      ANTNEST_TELEMETRY_CAPTURE_RPC_CONTENT: ${ANTNEST_TELEMETRY_CAPTURE_RPC_CONTENT:-false}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      ANTNEST_SERVICE_AUTH_MODE: token
      ANTNEST_SERVICE_AUTH_ALLOW_INSECURE_TRANSPORT: "true"
      ANTNEST_SERVICE_AUTH_CALLERS_FILE: /etc/antnest/service-auth/callers.json
      ANTNEST_SERVICE_AUTH_TOKEN_DIR: /etc/antnest/service-auth/tokens
      ANTNEST_EGRESS_HEALTH_LISTEN: 127.0.0.1:8082
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
    devices:
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/runtime-egress
        - --healthcheck
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    networks:
      observability:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.123
      control:
        ipv4_address: ${ANTNEST_EGRESS_CONTROL_IPV4:-172.31.255.3}
      egress-database: {}
      egress:
        gw_priority: 1
      runtime-management:
        ipv4_address: ${ANTNEST_EGRESS_IPV4:-172.30.255.3}
    stop_grace_period: 10s
    volumes:
      - type: bind
        source:
          ${ANTNEST_SERVICE_AUTH_DIRECTORY:?prepare development authentication with
          scripts/dev-service-tokens.mjs}/runtime-egress/callers.json
        target: /etc/antnest/service-auth/callers.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source:
          ${ANTNEST_SERVICE_AUTH_DIRECTORY:?prepare development authentication with
          scripts/dev-service-tokens.mjs}/runtime-egress/tokens
        target: /etc/antnest/service-auth/tokens
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      jaeger: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.114

  runtime-controller:
    image: antnest/runtime-controller:local
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/runtime-controller/Dockerfile
    depends_on:
      jaeger:
        condition: service_started
        required: false
      postgres:
        condition: service_healthy
    environment:
      ANTNEST_RUNTIME_CONTROLLER_DATABASE_URL: postgres://antnest_runtime_controller:${ANTNEST_RUNTIME_CONTROLLER_POSTGRES_PASSWORD:?ANTNEST_RUNTIME_CONTROLLER_POSTGRES_PASSWORD is required; run scripts/generate-dev-env.sh}@postgres:5432/antnest_runtime_controller
      ANTNEST_RUNTIME_CONTROLLER_LISTEN: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.50:8080
      ANTNEST_RUNTIME_PLATFORM: docker
      ANTNEST_DOCKER_HOST: unix:///var/run/docker.sock
      ANTNEST_RUNTIME_CONTROLLER_SCOPE: ${ANTNEST_RUNTIME_CONTROLLER_SCOPE:-antnest-platform}
      ANTNEST_RUNTIME_MANAGEMENT_NETWORK: ${ANTNEST_RUNTIME_MANAGEMENT_NETWORK:-antnest-runtime-management}
      ANTNEST_RUNTIME_SYSTEM_SKILLS_VOLUME: ${ANTNEST_RUNTIME_SYSTEM_SKILLS_VOLUME:-antnest-system-skills}
      ANTNEST_SKILL_REGISTRY_URL: http://skill-registry:8080
      ANTNEST_AGENT_CONTROLLER_URL: http://agent-controller:8080
      ANTNEST_RUNTIME_SKILL_PREPARER_IMAGE: antnest/runtime-controller:local
      ANTNEST_RUNTIME_MUTATION_TIMEOUT: ${ANTNEST_RUNTIME_MUTATION_TIMEOUT:-2m}
      ANTNEST_RUNTIME_CONTROLLER_MONITOR_MAX_RETRY_DELAY: ${ANTNEST_RUNTIME_CONTROLLER_MONITOR_MAX_RETRY_DELAY:-30s}
      ANTNEST_RUNTIME_SKILL_MAINTENANCE_VERIFIERS: ${ANTNEST_RUNTIME_SKILL_MAINTENANCE_VERIFIERS:-}
      ANTNEST_TELEMETRY_CAPTURE_RPC_CONTENT: ${ANTNEST_TELEMETRY_CAPTURE_RPC_CONTENT:-false}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-}
      ANTNEST_RUNTIME_OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      ANTNEST_RUNTIME_OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      ANTNEST_RUNTIME_OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
      ANTNEST_RUNTIME_OTEL_EXPORTER_OTLP_ENDPOINT: ${ANTNEST_RUNTIME_OTEL_EXPORTER_OTLP_ENDPOINT:-http://${ANTNEST_RUNTIME_OTLP_INGRESS_IPV4:-172.30.255.4}:4318}
      ANTNEST_RUNTIME_OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-}
      ANTNEST_SERVICE_AUTH_MODE: token
      ANTNEST_SERVICE_AUTH_ALLOW_INSECURE_TRANSPORT: "true"
      ANTNEST_SERVICE_AUTH_CALLERS_FILE: /etc/antnest/service-auth/callers.json
      ANTNEST_SERVICE_AUTH_TOKEN_DIR: /etc/antnest/service-auth/tokens
      ANTNEST_RUNTIME_INSTANCE_KEY_FILE: /etc/antnest/runtime-instance/master.key
      ANTNEST_RUNTIME_CONTROLLER_HEALTH_LISTEN: 127.0.0.1:8082
      ANTNEST_RUNTIME_ALLOWED_IMAGES: ${ANTNEST_RUNTIME_ALLOWED_IMAGES:-["antnest/antnest-runtime"]}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runtime-system-skills:/system-skills-volume:ro
      - type: bind
        source:
          ${ANTNEST_SERVICE_AUTH_DIRECTORY:?prepare development authentication with
          scripts/dev-service-tokens.mjs}/runtime-controller/callers.json
        target: /etc/antnest/service-auth/callers.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source:
          ${ANTNEST_SERVICE_AUTH_DIRECTORY:?prepare development authentication with
          scripts/dev-service-tokens.mjs}/runtime-controller/tokens
        target: /etc/antnest/service-auth/tokens
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source:
          ${ANTNEST_SERVICE_AUTH_DIRECTORY:?prepare development authentication with
          scripts/dev-service-tokens.mjs}/runtime-controller/instance-master.key
        target: /etc/antnest/runtime-instance/master.key
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/usr/local/bin/runtime-controller", "--healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    networks:
      controller-runtime:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.50
      controller-clients:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.24
      registry-clients:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.85
      observability:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.121
      runtime-controller-database: {}
      runtime-management:
        ipv4_address: ${ANTNEST_RUNTIME_CONTROLLER_MANAGEMENT_IPV4:-172.30.255.5}
    stop_grace_period: 30s
    extra_hosts:
      skill-registry: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.82
      agent-controller: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.18
      jaeger: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.114

  agent-acp-service:
    profiles: [stage2, stage3]
    image: antnest/agent-acp-service:local
    build:
      context: .
      dockerfile: services/agent-acp-service/Dockerfile
    depends_on:
      jaeger:
        condition: service_started
        required: false
      postgres:
        condition: service_healthy
    environment:
      ANTNEST_ACP_DATABASE_URL: postgres://antnest_agent_acp:${ANTNEST_AGENT_ACP_POSTGRES_PASSWORD:?ANTNEST_AGENT_ACP_POSTGRES_PASSWORD is required; run scripts/generate-dev-env.sh}@postgres:5432/antnest_agent_acp
      ANTNEST_ACP_CLIENT_MCP_KEY: ${ANTNEST_ACP_CLIENT_MCP_KEY:?ANTNEST_ACP_CLIENT_MCP_KEY is required; run scripts/generate-dev-env.sh}
      ANTNEST_ACP_LISTEN: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.5:8080
      ANTNEST_ACP_RUN_TIMEOUT: ${ANTNEST_ACP_RUN_TIMEOUT:-30m}
      ANTNEST_ACP_SKILL_LEARNING_CONTROLLER_URL: ${ANTNEST_ACP_SKILL_MAINTENANCE_SIGNING_KEY:+http://agent-controller:8080}
      ANTNEST_ACP_SKILL_MAINTENANCE_SIGNING_KID: ${ANTNEST_ACP_SKILL_MAINTENANCE_SIGNING_KID:-}
      ANTNEST_ACP_SKILL_MAINTENANCE_SIGNING_KEY: ${ANTNEST_ACP_SKILL_MAINTENANCE_SIGNING_KEY:-}
      ANTNEST_ACP_SKILL_REGISTRY_URL: ${ANTNEST_ACP_SKILL_MAINTENANCE_SIGNING_KEY:+http://skill-registry:8080}
      ANTNEST_ACP_MAX_CONFIGURATION_BYTES: ${ANTNEST_ACP_MAX_CONFIGURATION_BYTES:-16777216}
      ANTNEST_ACP_MAX_PROMPT_BYTES: ${ANTNEST_ACP_MAX_PROMPT_BYTES:-16777216}
      ANTNEST_ACP_SHUTDOWN_TIMEOUT: ${ANTNEST_ACP_SHUTDOWN_TIMEOUT:-15s}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_SERVICE_NAME: agent-acp-service
      ANTNEST_TELEMETRY_CAPTURE_RPC_CONTENT: ${ANTNEST_TELEMETRY_CAPTURE_RPC_CONTENT:-false}
      ANTNEST_SERVICE_AUTH_MODE: token
      ANTNEST_SERVICE_AUTH_ALLOW_INSECURE_TRANSPORT: "true"
      ANTNEST_SERVICE_AUTH_CALLERS_FILE: /etc/antnest/service-auth/callers.json
      ANTNEST_SERVICE_AUTH_TOKEN_DIR: /etc/antnest/service-auth/tokens
      ANTNEST_ACP_CONTROL_LISTEN: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.34:8081
      ANTNEST_ACP_IDENTITY_URL: http://identity-service:8080
      ANTNEST_PROVIDER_ALLOW_PRIVATE_ENDPOINTS: ${ANTNEST_PROVIDER_ALLOW_PRIVATE_ENDPOINTS:-false}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://'+process.env.ANTNEST_ACP_LISTEN+'/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    networks:
      edge:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.5
      controller-clients:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.22
      controller-acp:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.34
      identity-clients:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.71
      registry-clients:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.86
      observability:
        ipv4_address: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.120
      agent-acp-database: {}
      acp-provider:
        gw_priority: 1
      runtime-management:
        ipv4_address: ${ANTNEST_ACP_MANAGEMENT_IPV4:-172.30.255.6}
    stop_grace_period: 20s
    user:
      ${ANTNEST_SERVICE_AUTH_UID:?required generated UID}:${ANTNEST_SERVICE_AUTH_GID:?required
      generated GID}
    volumes:
      - type: bind
        source:
          ${ANTNEST_SERVICE_AUTH_DIRECTORY:?prepare development authentication with
          scripts/dev-service-tokens.mjs}/agent-acp-service/callers.json
        target: /etc/antnest/service-auth/callers.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source:
          ${ANTNEST_SERVICE_AUTH_DIRECTORY:?prepare development authentication with
          scripts/dev-service-tokens.mjs}/agent-acp-service/tokens
        target: /etc/antnest/service-auth/tokens
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      identity-service: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.66
      agent-controller: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.18
      skill-registry: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.82
      jaeger: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.114

  stage2-model:
    profiles: [stage2-e2e]
    image: node:24.21.0-bookworm-slim
    command: ["node", "/fixtures/stage2-model-server.mjs"]
    environment:
      ANTNEST_STAGE2_MODEL_PORT: "8080"
      ANTNEST_STAGE2_MODEL_CREDENTIAL: stage2-model-secret
    volumes:
      - ./tests/e2e/agent-acp-service/stage2-model-server.mjs:/fixtures/stage2-model-server.mjs:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/status').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      timeout: 2s
      retries: 3
      start_period: 20s
      start_interval: 1s
    networks:
      controller-provider: {}
      acp-provider: {}

  stage3-model:
    profiles: [stage3-e2e]
    image: node:24.21.0-bookworm-slim
    command: ["node", "/fixtures/stage2-model-server.mjs"]
    environment:
      ANTNEST_STAGE2_MODEL_PORT: "8080"
      ANTNEST_STAGE2_MODEL_CREDENTIAL: stage3-model-secret
    volumes:
      - ./tests/e2e/agent-acp-service/stage2-model-server.mjs:/fixtures/stage2-model-server.mjs:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/status').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      timeout: 2s
      retries: 3
      start_period: 20s
      start_interval: 1s
    networks:
      controller-provider: {}
      acp-provider: {}

  identity-service:
    profiles: [stage2, stage3]
    image: antnest/identity-service:local
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    depends_on:
      jaeger:
        condition: service_started
        required: false
      postgres:
        condition: service_healthy
    environment:
      ANTNEST_IDENTITY_DATABASE_URL: postgres://antnest_identity:${ANTNEST_IDENTITY_POSTGRES_PASSWORD:?ANTNEST_IDENTITY_POSTGRES_PASSWORD is required; run scripts/generate-dev-env.sh}@postgres:5432/antnest_identity
      ANTNEST_IDENTITY_ENCRYPTION_KEY: ${ANTNEST_IDENTITY_ENCRYPTION_KEY:-}
      ANTNEST_IDENTITY_ENCRYPTION_KEYS: ${ANTNEST_IDENTITY_ENCRYPTION_KEYS:-}
      ANTNEST_IDENTITY_ENCRYPTION_ACTIVE_KID: ${ANTNEST_IDENTITY_ENCRYPTION_ACTIVE_KID:-}
      ANTNEST_IDENTITY_PUBLIC_BASE_URL: ${ANTNEST_EDGE_PUBLIC_BASE_URL:-http://127.0.0.1:8090}
      ANTNEST_IDENTITY_LISTEN: ${ANTNEST_SERVICE_NETWORK_PREFIX:-10.241.0}.66:8080
      ANTNEST_BOOTSTRAP_ORGANIZATION_SLUG: ${ANTNEST_BOOTSTRAP_ORGANIZATION_SLUG:-engineering}
      ANTNEST_BOOTSTRAP_ORGANIZATION_NAME: ${ANTNEST_BOOTSTRAP_ORGANIZATION_NAME:-Engineering}
      ANTNEST_BOOTSTRAP_ADMIN_EMAIL: ${ANTNEST_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      ANTNEST_BOOTSTRAP_ADMIN_PASSWORD: ${ANTNEST_BOOTSTRAP_ADMIN_PASSWORD:?ANTNEST_BOOTSTRAP_ADMIN_PASSWORD is required; run scripts/generate-dev-env.sh}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-}
      OTEL_SERVICE_NAME: identity-service
      ANTNEST_TELEMETRY_CAPTURE_RPC_CONTENT: ${ANTNEST_TELEMETRY_CAPTURE_RPC_CONTENT:-false}
      ANTNEST_SERVICE_AUTH_MODE: token
      ANTNEST_SERVICE_AUTH_ALLOW_INSECURE_TRANSPORT: "true"
      ANTNEST_SERVICE_AUTH_CALLERS_FILE: /etc/antnest/service-auth/callers.json
