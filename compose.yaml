name: antnest-platform

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: antnest_test_admin
      POSTGRES_PASSWORD: ${ANTNEST_POSTGRES_ADMIN_PASSWORD:-antnest-postgres-dev}
      ANTNEST_EGRESS_POSTGRES_PASSWORD: ${ANTNEST_EGRESS_POSTGRES_PASSWORD:-antnest-egress-dev}
      ANTNEST_RUNTIME_CONTROLLER_POSTGRES_PASSWORD: ${ANTNEST_RUNTIME_CONTROLLER_POSTGRES_PASSWORD:-antnest-runtime-controller-dev}
      ANTNEST_AGENT_ACP_POSTGRES_PASSWORD: ${ANTNEST_AGENT_ACP_POSTGRES_PASSWORD:-antnest-agent-acp-dev}
      ANTNEST_IDENTITY_POSTGRES_PASSWORD: ${ANTNEST_IDENTITY_POSTGRES_PASSWORD:-antnest-identity-dev}
      ANTNEST_AGENT_CONTROLLER_POSTGRES_PASSWORD: ${ANTNEST_AGENT_CONTROLLER_POSTGRES_PASSWORD:-antnest-agent-controller-dev}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'test -f "$$PGDATA/.antnest-init-complete" && pg_isready -h 127.0.0.1 -U antnest_test_admin -d postgres',
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-antnest-services.sh:ro
    ports:
      - 127.0.0.1:${ANTNEST_POSTGRES_HOST_PORT:-55432}:5432
    networks:
      [
        egress-database,
        runtime-controller-database,
        agent-acp-database,
        identity-database,
        agent-controller-database,
        temporal-database,
      ]

  temporal-databases:
    profiles: [stage2, stage3]
    image: postgres:17-bookworm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: antnest_test_admin
      PGPASSWORD: ${ANTNEST_POSTGRES_ADMIN_PASSWORD:-antnest-postgres-dev}
      ANTNEST_TEMPORAL_POSTGRES_PASSWORD: ${ANTNEST_TEMPORAL_POSTGRES_PASSWORD:-antnest-temporal-dev}
    entrypoint: [sh, /scripts/init-databases.sh]
    volumes:
      - ./scripts/temporal/init-databases.sh:/scripts/init-databases.sh:ro
    networks: [temporal-database]

  temporal-schema:
    profiles: [stage2, stage3]
    image: temporalio/admin-tools:1.31.0
    depends_on:
      temporal-databases:
        condition: service_completed_successfully
    environment:
      SQL_PASSWORD: ${ANTNEST_TEMPORAL_POSTGRES_PASSWORD:-antnest-temporal-dev}
    entrypoint: [sh, /scripts/setup-schema.sh]
    volumes:
      - ./scripts/temporal/setup-schema.sh:/scripts/setup-schema.sh:ro
    networks: [temporal-database]

  temporal:
    profiles: [stage2, stage3]
    image: antnest/temporal:local
    build:
      context: .
      dockerfile: scripts/temporal/Dockerfile
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      DBNAME: antnest_temporal
      VISIBILITY_DBNAME: antnest_temporal_visibility
      POSTGRES_USER: antnest_temporal
      POSTGRES_PWD: ${ANTNEST_TEMPORAL_POSTGRES_PASSWORD:-antnest-temporal-dev}
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      NUM_HISTORY_SHARDS: 4
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/docker.yaml
    volumes:
      - ./scripts/temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/docker.yaml:ro
    healthcheck:
      test: [CMD, sh, /etc/temporal/readiness.sh]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      start_interval: 2s
    ports:
      - 127.0.0.1:${ANTNEST_TEMPORAL_HOST_PORT:-7233}:7233
    networks: [temporal-database, development]
    stop_grace_period: 30s

  temporal-namespace:
    profiles: [stage2, stage3]
    image: temporalio/admin-tools:1.31.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    entrypoint: [sh, /scripts/setup-namespace.sh]
    volumes:
      - ./scripts/temporal/setup-namespace.sh:/scripts/setup-namespace.sh:ro
    networks: [development]

  runtime-egress:
    image: antnest/runtime-egress:local
    build:
      context: .
      dockerfile: services/runtime-egress/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANTNEST_EGRESS_DATABASE_URL: postgres://antnest_egress:${ANTNEST_EGRESS_POSTGRES_PASSWORD:-antnest-egress-dev}@postgres:5432/antnest_egress
      ANTNEST_EGRESS_DATABASE_TLS_MODE: disable
      ANTNEST_EGRESS_CONTROL_LISTEN: ${ANTNEST_EGRESS_CONTROL_IPV4:-172.31.255.3}:8081
      ANTNEST_EGRESS_UDP_ADVERTISE: ${ANTNEST_EGRESS_IPV4:-172.30.255.3}:8092
      ANTNEST_EGRESS_TUNNEL_CIDR: 100.64.0.0/10
      ANTNEST_EGRESS_RESOLVER_IPV4: 100.64.0.1
      ANTNEST_EGRESS_DNS_UPSTREAM: ${ANTNEST_EGRESS_DNS_UPSTREAM:-127.0.0.11:53}
      ANTNEST_TELEMETRY_CAPTURE_RPC_CONTENT: ${ANTNEST_TELEMETRY_CAPTURE_RPC_CONTENT:-false}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
    devices:
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl --fail --silent http://${ANTNEST_EGRESS_CONTROL_IPV4:-172.31.255.3}:8081/status | grep -q ''"status":"ready"''',
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    networks:
      control:
        ipv4_address: ${ANTNEST_EGRESS_CONTROL_IPV4:-172.31.255.3}
      egress-database: {}
      egress:
        gw_priority: 1
      observability: {}
      runtime-management:
        ipv4_address: ${ANTNEST_EGRESS_IPV4:-172.30.255.3}
    stop_grace_period: 10s

  runtime-controller:
    image: antnest/runtime-controller:local
    build:
      context: .
      dockerfile: services/runtime-controller/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANTNEST_RUNTIME_CONTROLLER_DATABASE_URL: postgres://antnest_runtime_controller:${ANTNEST_RUNTIME_CONTROLLER_POSTGRES_PASSWORD:-antnest-runtime-controller-dev}@postgres:5432/antnest_runtime_controller
      ANTNEST_RUNTIME_CONTROLLER_LISTEN: :8080
      ANTNEST_RUNTIME_PLATFORM: docker
      ANTNEST_DOCKER_HOST: unix:///var/run/docker.sock
      ANTNEST_RUNTIME_CONTROLLER_SCOPE: ${ANTNEST_RUNTIME_CONTROLLER_SCOPE:-antnest-platform}
      ANTNEST_RUNTIME_MANAGEMENT_NETWORK: ${ANTNEST_RUNTIME_MANAGEMENT_NETWORK:-antnest-runtime-management}
      ANTNEST_RUNTIME_SYSTEM_SKILLS_VOLUME: ${ANTNEST_RUNTIME_SYSTEM_SKILLS_VOLUME:-antnest-system-skills}
      ANTNEST_RUNTIME_MUTATION_TIMEOUT: ${ANTNEST_RUNTIME_MUTATION_TIMEOUT:-2m}
      ANTNEST_TELEMETRY_CAPTURE_RPC_CONTENT: ${ANTNEST_TELEMETRY_CAPTURE_RPC_CONTENT:-false}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-}
      ANTNEST_RUNTIME_OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      ANTNEST_RUNTIME_OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      ANTNEST_RUNTIME_OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
      ANTNEST_RUNTIME_OTEL_EXPORTER_OTLP_ENDPOINT: ${ANTNEST_RUNTIME_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      ANTNEST_RUNTIME_OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runtime-system-skills:/system-skills-volume:ro
    ports:
      - 127.0.0.1:${ANTNEST_RUNTIME_CONTROLLER_HOST_PORT:-58080}:8080
    healthcheck:
      test: ["CMD", "/usr/local/bin/runtime-controller", "--healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    networks:
      [
        runtime-controller-database,
        runtime-management,
        development,
        observability,
      ]
    stop_grace_period: 10s

  agent-acp-service:
    profiles: [stage2, stage3]
    image: antnest/agent-acp-service:local
    build:
      context: .
      dockerfile: services/agent-acp-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANTNEST_ACP_DATABASE_URL: postgres://antnest_agent_acp:${ANTNEST_AGENT_ACP_POSTGRES_PASSWORD:-antnest-agent-acp-dev}@postgres:5432/antnest_agent_acp
      ANTNEST_ACP_CLIENT_MCP_KEY: ${ANTNEST_ACP_CLIENT_MCP_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      ANTNEST_ACP_LISTEN: :8080
      ANTNEST_ACP_RUN_TIMEOUT: ${ANTNEST_ACP_RUN_TIMEOUT:-30m}
      ANTNEST_ACP_MAX_CONFIGURATION_BYTES: ${ANTNEST_ACP_MAX_CONFIGURATION_BYTES:-16777216}
      ANTNEST_ACP_MAX_PROMPT_BYTES: ${ANTNEST_ACP_MAX_PROMPT_BYTES:-16777216}
      ANTNEST_ACP_SHUTDOWN_TIMEOUT: ${ANTNEST_ACP_SHUTDOWN_TIMEOUT:-15s}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: agent-acp-service
      ANTNEST_TELEMETRY_CAPTURE_RPC_CONTENT: ${ANTNEST_TELEMETRY_CAPTURE_RPC_CONTENT:-false}
    ports:
      - 127.0.0.1:${ANTNEST_ACP_HOST_PORT:-58081}:8080
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:8080/status",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    networks:
      [agent-acp-database, runtime-management, development, observability]
    stop_grace_period: 20s

  stage2-model:
    profiles: [stage2-e2e]
    image: node:24-bookworm-slim
    command: ["node", "/fixtures/stage2-model-server.mjs"]
    environment:
      ANTNEST_STAGE2_MODEL_PORT: "8080"
      ANTNEST_STAGE2_MODEL_CREDENTIAL: stage2-model-secret
    volumes:
      - ./tests/e2e/agent-acp-service/stage2-model-server.mjs:/fixtures/stage2-model-server.mjs:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/status').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      timeout: 2s
      retries: 3
      start_period: 20s
      start_interval: 1s
    networks: [development]

  stage3-model:
    profiles: [stage3-e2e]
    image: node:24-bookworm-slim
    command: ["node", "/fixtures/stage2-model-server.mjs"]
    environment:
      ANTNEST_STAGE2_MODEL_PORT: "8080"
      ANTNEST_STAGE2_MODEL_CREDENTIAL: stage3-model-secret
    volumes:
      - ./tests/e2e/agent-acp-service/stage2-model-server.mjs:/fixtures/stage2-model-server.mjs:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/status').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      timeout: 2s
      retries: 3
      start_period: 20s
      start_interval: 1s
    networks: [development]

  identity-service:
    profiles: [stage2, stage3]
    image: antnest/identity-service:local
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANTNEST_IDENTITY_DATABASE_URL: postgres://antnest_identity:${ANTNEST_IDENTITY_POSTGRES_PASSWORD:-antnest-identity-dev}@postgres:5432/antnest_identity
      ANTNEST_IDENTITY_ENCRYPTION_KEY: ${ANTNEST_IDENTITY_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      ANTNEST_IDENTITY_PUBLIC_BASE_URL: http://127.0.0.1:${ANTNEST_IDENTITY_HOST_PORT:-58082}
      ANTNEST_IDENTITY_LISTEN: :8080
      ANTNEST_BOOTSTRAP_ORGANIZATION_SLUG: ${ANTNEST_BOOTSTRAP_ORGANIZATION_SLUG:-engineering}
      ANTNEST_BOOTSTRAP_ORGANIZATION_NAME: ${ANTNEST_BOOTSTRAP_ORGANIZATION_NAME:-Engineering}
      ANTNEST_BOOTSTRAP_ADMIN_EMAIL: ${ANTNEST_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      ANTNEST_BOOTSTRAP_ADMIN_PASSWORD: ${ANTNEST_BOOTSTRAP_ADMIN_PASSWORD:-antnest-admin-dev}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-}
      OTEL_SERVICE_NAME: identity-service
      ANTNEST_TELEMETRY_CAPTURE_RPC_CONTENT: ${ANTNEST_TELEMETRY_CAPTURE_RPC_CONTENT:-false}
    ports:
      - 127.0.0.1:${ANTNEST_IDENTITY_HOST_PORT:-58082}:8080
    healthcheck:
      test: ["CMD", "/usr/local/bin/identity-service", "--healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    networks: [identity-database, development]
    stop_grace_period: 20s

  agent-controller:
    profiles: [stage2, stage3]
    image: antnest/agent-controller:local
    build:
      context: .
      dockerfile: services/agent-controller/Dockerfile
    depends_on:
      temporal:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      runtime-egress:
        condition: service_healthy
      runtime-controller:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    environment:
      ANTNEST_TEMPORAL_ADDRESS: temporal:7233
      ANTNEST_AGENT_CONTROLLER_DATABASE_URL: postgres://antnest_agent_controller:${ANTNEST_AGENT_CONTROLLER_POSTGRES_PASSWORD:-antnest-agent-controller-dev}@postgres:5432/antnest_agent_controller
      ANTNEST_AGENT_CONTROLLER_ENCRYPTION_KEY: ${ANTNEST_AGENT_CONTROLLER_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      ANTNEST_AGENT_CONTROLLER_LISTEN: :8080
      ANTNEST_AGENT_CONTROLLER_DEPENDENCY_TIMEOUT: ${ANTNEST_AGENT_CONTROLLER_DEPENDENCY_TIMEOUT:-150s}
      ANTNEST_AGENT_CONTROLLER_DRAIN_TIMEOUT: ${ANTNEST_AGENT_CONTROLLER_DRAIN_TIMEOUT:-5m}
      ANTNEST_AGENT_ACP_SERVICE_URL: ${ANTNEST_AGENT_ACP_SERVICE_URL:-http://agent-acp-service:8080}
      ANTNEST_ACP_MAX_CONFIGURATION_BYTES: ${ANTNEST_ACP_MAX_CONFIGURATION_BYTES:-16777216}
      ANTNEST_AGENT_CONTROLLER_EXECUTION_RESYNC_INTERVAL: ${ANTNEST_AGENT_CONTROLLER_EXECUTION_RESYNC_INTERVAL:-30s}
      ANTNEST_AGENT_CONTROLLER_EXECUTION_RETRY_INTERVAL: ${ANTNEST_AGENT_CONTROLLER_EXECUTION_RETRY_INTERVAL:-1s}
      ANTNEST_AGENT_CONTROLLER_EXECUTION_MAX_RETRY_INTERVAL: ${ANTNEST_AGENT_CONTROLLER_EXECUTION_MAX_RETRY_INTERVAL:-30s}
      ANTNEST_AGENT_CONTROLLER_EXECUTION_REQUEST_TIMEOUT: ${ANTNEST_AGENT_CONTROLLER_EXECUTION_REQUEST_TIMEOUT:-15s}
      ANTNEST_AGENT_CONTROLLER_SHUTDOWN_TIMEOUT: ${ANTNEST_AGENT_CONTROLLER_SHUTDOWN_TIMEOUT:-15s}
      ANTNEST_RUNTIME_EGRESS_URL: http://${ANTNEST_EGRESS_CONTROL_IPV4:-172.31.255.3}:8081
      ANTNEST_RUNTIME_CONTROLLER_URL: http://runtime-controller:8080
      ANTNEST_IDENTITY_SERVICE_URL: http://identity-service:8080
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-}
      OTEL_SERVICE_NAME: agent-controller
      ANTNEST_TELEMETRY_CAPTURE_RPC_CONTENT: ${ANTNEST_TELEMETRY_CAPTURE_RPC_CONTENT:-false}
    ports:
      - 127.0.0.1:${ANTNEST_AGENT_CONTROLLER_HOST_PORT:-58083}:8080
    healthcheck:
      test: ["CMD", "/usr/local/bin/agent-controller", "--healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    networks: [agent-controller-database, control, development, observability]
    stop_grace_period: 20s

  admin-console:
    profiles: [stage3]
    image: antnest/admin-console:local
    build:
      context: .
      dockerfile: services/admin-console/Dockerfile
    depends_on:
      identity-service:
        condition: service_healthy
      agent-controller:
        condition: service_healthy
    environment:
      ANTNEST_ADMIN_CONSOLE_LISTEN: :8080
      ANTNEST_IDENTITY_SERVICE_URL: http://identity-service:8080
      ANTNEST_AGENT_CONTROLLER_URL: http://agent-controller:8080
      ANTNEST_AGENT_ACP_SERVICE_URL: ${ANTNEST_AGENT_ACP_SERVICE_URL:-http://agent-acp-service:8080}
      ANTNEST_ADMIN_DEFAULT_RUNTIME_IMAGE_REF: ${ANTNEST_ADMIN_DEFAULT_RUNTIME_IMAGE_REF:-}
      ANTNEST_ADMIN_DEPENDENCY_TIMEOUT: ${ANTNEST_ADMIN_DEPENDENCY_TIMEOUT:-150s}
      ANTNEST_ADMIN_SHUTDOWN_TIMEOUT: ${ANTNEST_ADMIN_SHUTDOWN_TIMEOUT:-15s}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      OTEL_SERVICE_NAME: admin-console
      ANTNEST_TELEMETRY_CAPTURE_RPC_CONTENT: ${ANTNEST_TELEMETRY_CAPTURE_RPC_CONTENT:-false}
    healthcheck:
      test: ["CMD", "/usr/local/bin/admin-console", "--healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    networks: [development, observability]
    stop_grace_period: 20s

  agent-ui:
    profiles: [stage3]
    image: antnest/agent-ui:local
    build:
      context: .
      dockerfile: services/agent-ui/Dockerfile
    depends_on:
      agent-acp-service:
        condition: service_healthy
      agent-controller:
        condition: service_healthy
    environment:
      ANTNEST_AGENT_ACP_SERVICE_URL: http://agent-acp-service:8080
      ANTNEST_AGENT_UI_ACP_MAX_PROMPT_BYTES: ${ANTNEST_ACP_MAX_PROMPT_BYTES:-16777216}
      ANTNEST_AGENT_CONTROLLER_URL: http://agent-controller:8080
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: agent-ui
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 1s
    networks: [development, observability]
    stop_grace_period: 30s

  edge-gateway:
    profiles: [stage3]
    image: antnest/edge-gateway:local
    build:
      context: .
      dockerfile: services/edge-gateway/Dockerfile
    depends_on:
      identity-service:
        condition: service_healthy
      admin-console:
        condition: service_healthy
      agent-ui:
        condition: service_healthy
      agent-acp-service:
        condition: service_healthy
      agent-controller:
        condition: service_healthy
    environment:
      ANTNEST_EDGE_LISTEN: :8080
      ANTNEST_IDENTITY_SERVICE_URL: http://identity-service:8080
      ANTNEST_ADMIN_CONSOLE_URL: http://admin-console:8080
      ANTNEST_AGENT_UI_URL: http://agent-ui:8080
      ANTNEST_AGENT_ACP_URL: http://agent-acp-service:8080
      ANTNEST_AGENT_CONTROLLER_URL: http://agent-controller:8080
      ANTNEST_EDGE_COOKIE_SECURE: ${ANTNEST_EDGE_COOKIE_SECURE:-false}
      ANTNEST_EDGE_REQUEST_TIMEOUT: ${ANTNEST_EDGE_REQUEST_TIMEOUT:-150s}
      ANTNEST_EDGE_SHUTDOWN_TIMEOUT: ${ANTNEST_EDGE_SHUTDOWN_TIMEOUT:-15s}
      ANTNEST_TELEMETRY_CAPTURE_RPC_CONTENT: ${ANTNEST_TELEMETRY_CAPTURE_RPC_CONTENT:-false}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      OTEL_SERVICE_NAME: edge-gateway
    ports:
      - 127.0.0.1:${ANTNEST_EDGE_HOST_PORT:-8090}:8080
    healthcheck:
      test: ["CMD", "/usr/local/bin/edge-gateway", "--healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    networks: [development, observability]
    stop_grace_period: 30s

  jaeger:
    profiles: [observability]
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    ports:
      - 127.0.0.1:${ANTNEST_JAEGER_UI_HOST_PORT:-16686}:16686
    networks:
      development: {}
      observability: {}
      runtime-management:
        ipv4_address: ${ANTNEST_JAEGER_RUNTIME_IPV4:-172.30.255.4}

networks:
  control:
    internal: true
    ipam:
      config:
        - subnet: ${ANTNEST_EGRESS_CONTROL_SUBNET:-172.31.255.0/24}
  development: {}
  observability:
