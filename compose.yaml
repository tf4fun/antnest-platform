name: antnest-platform

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: antnest_egress
      POSTGRES_USER: antnest_egress
      POSTGRES_PASSWORD: ${ANTNEST_EGRESS_POSTGRES_PASSWORD:-antnest-egress-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antnest_egress -d antnest_egress"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - egress-postgres:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${ANTNEST_EGRESS_POSTGRES_HOST_PORT:-55432}:5432
    networks: [egress-database]

  runtime-egress:
    image: antnest/runtime-egress:local
    build:
      context: .
      dockerfile: services/runtime-egress/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANTNEST_EGRESS_DATABASE_URL: postgres://antnest_egress:${ANTNEST_EGRESS_POSTGRES_PASSWORD:-antnest-egress-dev}@postgres:5432/antnest_egress
      ANTNEST_EGRESS_DATABASE_TLS_MODE: disable
      ANTNEST_EGRESS_CONTROL_LISTEN: ${ANTNEST_EGRESS_CONTROL_IPV4:-172.31.255.3}:8081
      ANTNEST_EGRESS_UDP_ADVERTISE: ${ANTNEST_EGRESS_IPV4:-172.30.255.3}:8092
      ANTNEST_EGRESS_TUNNEL_CIDR: 100.64.0.0/10
      ANTNEST_EGRESS_RESOLVER_IPV4: 100.64.0.1
      ANTNEST_EGRESS_DNS_UPSTREAM: ${ANTNEST_EGRESS_DNS_UPSTREAM:-127.0.0.11:53}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
    devices:
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl --fail --silent http://${ANTNEST_EGRESS_CONTROL_IPV4:-172.31.255.3}:8081/status | grep -q ''"status":"ready"''',
        ]
      interval: 5s
      timeout: 2s
      retries: 12
    networks:
      control:
        ipv4_address: ${ANTNEST_EGRESS_CONTROL_IPV4:-172.31.255.3}
      egress-database: {}
      egress:
        gw_priority: 1
      observability: {}
      runtime-management:
        ipv4_address: ${ANTNEST_EGRESS_IPV4:-172.30.255.3}
    stop_grace_period: 10s

  runtime-controller-postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: antnest_runtime_controller
      POSTGRES_USER: antnest_runtime_controller
      POSTGRES_PASSWORD: ${ANTNEST_RUNTIME_CONTROLLER_POSTGRES_PASSWORD:-antnest-runtime-controller-dev}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U antnest_runtime_controller -d antnest_runtime_controller",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - runtime-controller-postgres:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${ANTNEST_RUNTIME_CONTROLLER_POSTGRES_HOST_PORT:-55433}:5432
    networks: [runtime-controller-database]

  runtime-controller:
    image: antnest/runtime-controller:local
    build:
      context: .
      dockerfile: services/runtime-controller/Dockerfile
    depends_on:
      runtime-controller-postgres:
        condition: service_healthy
    environment:
      ANTNEST_RUNTIME_CONTROLLER_DATABASE_URL: postgres://antnest_runtime_controller:${ANTNEST_RUNTIME_CONTROLLER_POSTGRES_PASSWORD:-antnest-runtime-controller-dev}@runtime-controller-postgres:5432/antnest_runtime_controller
      ANTNEST_RUNTIME_CONTROLLER_LISTEN: :8080
      ANTNEST_RUNTIME_PLATFORM: docker
      ANTNEST_DOCKER_HOST: unix:///var/run/docker.sock
      ANTNEST_RUNTIME_MANAGEMENT_NETWORK: ${ANTNEST_RUNTIME_MANAGEMENT_NETWORK:-antnest-runtime-management}
      ANTNEST_RUNTIME_SYSTEM_SKILLS_VOLUME: ${ANTNEST_RUNTIME_SYSTEM_SKILLS_VOLUME:-antnest-system-skills}
      ANTNEST_RUNTIME_MUTATION_TIMEOUT: ${ANTNEST_RUNTIME_MUTATION_TIMEOUT:-2m}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runtime-system-skills:/system-skills-volume:ro
    ports:
      - 127.0.0.1:${ANTNEST_RUNTIME_CONTROLLER_HOST_PORT:-58080}:8080
    healthcheck:
      test: ["CMD", "/usr/local/bin/runtime-controller", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [runtime-controller-database, runtime-management, development]
    stop_grace_period: 10s

  agent-acp-postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: antnest_agent_acp
      POSTGRES_USER: antnest_agent_acp
      POSTGRES_PASSWORD: ${ANTNEST_AGENT_ACP_POSTGRES_PASSWORD:-antnest-agent-acp-dev}
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U antnest_agent_acp -d antnest_agent_acp"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - agent-acp-postgres:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${ANTNEST_AGENT_ACP_POSTGRES_HOST_PORT:-55434}:5432
    networks: [agent-acp-database]

  agent-acp-service:
    profiles: [stage2]
    image: antnest/agent-acp-service:local
    build:
      context: .
      dockerfile: services/agent-acp-service/Dockerfile
    depends_on:
      agent-acp-postgres:
        condition: service_healthy
    environment:
      ANTNEST_ACP_DATABASE_URL: postgres://antnest_agent_acp:${ANTNEST_AGENT_ACP_POSTGRES_PASSWORD:-antnest-agent-acp-dev}@agent-acp-postgres:5432/antnest_agent_acp
      ANTNEST_AGENT_CONTROLLER_URL: ${ANTNEST_AGENT_CONTROLLER_URL:-http://agent-controller:8080}
      ANTNEST_ACP_CLIENT_MCP_KEY: ${ANTNEST_ACP_CLIENT_MCP_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      ANTNEST_ACP_LISTEN: :8080
      ANTNEST_ACP_CONTROLLER_TIMEOUT: ${ANTNEST_ACP_CONTROLLER_TIMEOUT:-5s}
      ANTNEST_ACP_MAX_PROMPT_BYTES: ${ANTNEST_ACP_MAX_PROMPT_BYTES:-16777216}
      ANTNEST_ACP_SHUTDOWN_TIMEOUT: ${ANTNEST_ACP_SHUTDOWN_TIMEOUT:-15s}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - 127.0.0.1:${ANTNEST_ACP_HOST_PORT:-58081}:8080
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/status').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [agent-acp-database, runtime-management, development]
    stop_grace_period: 20s

  identity-postgres:
    profiles: [stage2]
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: antnest_identity
      POSTGRES_USER: antnest_identity
      POSTGRES_PASSWORD: ${ANTNEST_IDENTITY_POSTGRES_PASSWORD:-antnest-identity-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antnest_identity -d antnest_identity"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - identity-postgres:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${ANTNEST_IDENTITY_POSTGRES_HOST_PORT:-55435}:5432
    networks: [identity-database]

  identity-service:
    profiles: [stage2]
    image: antnest/identity-service:local
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    depends_on:
      identity-postgres:
        condition: service_healthy
    environment:
      ANTNEST_IDENTITY_DATABASE_URL: postgres://antnest_identity:${ANTNEST_IDENTITY_POSTGRES_PASSWORD:-antnest-identity-dev}@identity-postgres:5432/antnest_identity
      ANTNEST_IDENTITY_ENCRYPTION_KEY: ${ANTNEST_IDENTITY_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      ANTNEST_IDENTITY_PUBLIC_BASE_URL: http://127.0.0.1:${ANTNEST_IDENTITY_HOST_PORT:-58082}
      ANTNEST_IDENTITY_LISTEN: :8080
      ANTNEST_BOOTSTRAP_ORGANIZATION_SLUG: ${ANTNEST_BOOTSTRAP_ORGANIZATION_SLUG:-engineering}
      ANTNEST_BOOTSTRAP_ORGANIZATION_NAME: ${ANTNEST_BOOTSTRAP_ORGANIZATION_NAME:-Engineering}
      ANTNEST_BOOTSTRAP_ADMIN_EMAIL: ${ANTNEST_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      ANTNEST_BOOTSTRAP_ADMIN_PASSWORD: ${ANTNEST_BOOTSTRAP_ADMIN_PASSWORD:-antnest-admin-dev}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - 127.0.0.1:${ANTNEST_IDENTITY_HOST_PORT:-58082}:8080
    healthcheck:
      test: ["CMD", "/usr/local/bin/identity-service", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [identity-database, development]
    stop_grace_period: 20s

  agent-controller-postgres:
    profiles: [stage2]
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: antnest_agent_controller
      POSTGRES_USER: antnest_agent_controller
      POSTGRES_PASSWORD: ${ANTNEST_AGENT_CONTROLLER_POSTGRES_PASSWORD:-antnest-agent-controller-dev}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U antnest_agent_controller -d antnest_agent_controller",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - agent-controller-postgres:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${ANTNEST_AGENT_CONTROLLER_POSTGRES_HOST_PORT:-55436}:5432
    networks: [agent-controller-database]

  agent-controller:
    profiles: [stage2]
    image: antnest/agent-controller:local
    build:
      context: .
      dockerfile: services/agent-controller/Dockerfile
    depends_on:
      agent-controller-postgres:
        condition: service_healthy
      runtime-egress:
        condition: service_healthy
      runtime-controller:
        condition: service_healthy
    environment:
      ANTNEST_AGENT_CONTROLLER_DATABASE_URL: postgres://antnest_agent_controller:${ANTNEST_AGENT_CONTROLLER_POSTGRES_PASSWORD:-antnest-agent-controller-dev}@agent-controller-postgres:5432/antnest_agent_controller
      ANTNEST_AGENT_CONTROLLER_ENCRYPTION_KEY: ${ANTNEST_AGENT_CONTROLLER_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      ANTNEST_AGENT_CONTROLLER_LISTEN: :8080
      ANTNEST_AGENT_CONTROLLER_DEPENDENCY_TIMEOUT: ${ANTNEST_AGENT_CONTROLLER_DEPENDENCY_TIMEOUT:-150s}
      ANTNEST_AGENT_CONTROLLER_DRAIN_TIMEOUT: ${ANTNEST_AGENT_CONTROLLER_DRAIN_TIMEOUT:-5m}
      ANTNEST_AGENT_CONTROLLER_RUN_ADMISSION_TTL: ${ANTNEST_AGENT_CONTROLLER_RUN_ADMISSION_TTL:-30m}
      ANTNEST_RUNTIME_EGRESS_URL: http://${ANTNEST_EGRESS_CONTROL_IPV4:-172.31.255.3}:8081
      ANTNEST_RUNTIME_CONTROLLER_URL: http://runtime-controller:8080
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-}
      OTEL_SERVICE_NAME: agent-controller
    ports:
      - 127.0.0.1:${ANTNEST_AGENT_CONTROLLER_HOST_PORT:-58083}:8080
    healthcheck:
      test: ["CMD", "/usr/local/bin/agent-controller", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [agent-controller-database, control, development]
    stop_grace_period: 20s

  jaeger:
    profiles: [observability]
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    ports:
      - 127.0.0.1:${ANTNEST_JAEGER_UI_HOST_PORT:-16686}:16686
    networks: [development, observability]

networks:
  control:
    internal: true
    ipam:
      config:
        - subnet: ${ANTNEST_EGRESS_CONTROL_SUBNET:-172.31.255.0/24}
  development: {}
  observability:
    internal: true
  egress: {}
  runtime-management:
    name: ${ANTNEST_RUNTIME_MANAGEMENT_NETWORK:-antnest-runtime-management}
    internal: true
    ipam:
      config:
        - subnet: ${ANTNEST_RUNTIME_MANAGEMENT_SUBNET:-172.30.255.0/24}
  egress-database: {}
  runtime-controller-database: {}
  agent-acp-database: {}
  identity-database: {}
  agent-controller-database: {}

volumes:
  egress-postgres:
  runtime-controller-postgres:
  runtime-system-skills:
    name: ${ANTNEST_RUNTIME_SYSTEM_SKILLS_VOLUME:-antnest-system-skills}
  agent-acp-postgres:
  identity-postgres:
  agent-controller-postgres:
